      cost: clampInt(qs('#m-cost',overlay).value,0,6,1),
      rarity: qs('#m-rarity',overlay).value,
      startingCount: clampInt(qs('#m-startcount',overlay).value,0,10,0),
      exhaust: qs('#m-exhaust',overlay).checked,
      pierce: qs('#m-pierce',overlay).checked,
      lifesteal: qs('#m-lifesteal',overlay).checked,
      retain: qs('#m-retain',overlay).checked,
      tags: parseTags(qs('#m-tags',overlay).value),
      scales: {},
      upgrades: { costDelta: clampInt(qs('#m-costdelta',overlay).value,-6,6,0), scalePP: {} },
      timing: qs('#m-timing',overlay).value,
      triggerTag: cleanTag(qs('#m-triggertag',overlay).value),
      triggerOn: qs('#m-triggeron',overlay).value==='damaged' ? 'damaged' : 'cardUsed',
      triggerBlocked: qs('#m-triggerblocked',overlay).checked,
      duration: qs('#m-duration',overlay).value,
    };
    allEffectFieldDefs().forEach(def=>{
      const min = def.min!==undefined ? def.min : 0;
      const dflt = def.default!==undefined ? def.default : 0;
      updated[def.key] = clampInt(qs(`#m-${def.key}`,overlay).value,min,def.max,dflt);
      if(def._statusId){
        const tv = qs(`#m-cst-${def._statusId}`,overlay);
        if(tv && ['self','opponent','both'].includes(tv.value)) updated['csT_'+def._statusId] = tv.value;

          const ux = clampInt(qs(`#m-upg-csx-${def._statusId}`,overlay).value,-99,99,0);
          if(ux) updated.upgrades['csX_'+def._statusId] = ux;
        }
      }
      updated.upgrades[def.key] = clampInt(qs(`#m-upg-${def.key}`,overlay).value,-99,99,0);
      const ppDeltaEl = qs(`#m-scaleppdelta-${def.key}`,overlay);
      if(ppDeltaEl){

/* ============================= RUN / BATTLE LOGIC ============================= */

function buildStartingDeck(){
  const deck = [];
  S.cards.forEach(c=>{
    if(isNonRewardCard(c)) return;
    for(let i=0;i<(c.startingCount||0);i++) deck.push(c.id);
  });
  if(deck.length===0){ // fallback safety
    deck.push('strike','strike','strike','defend','defend');
  }
  return deck;
}

// focusTag: cards carrying this tag get a much higher weight. onlyFocus: restrict the pool
// to tagged cards entirely (when any exist), used to guarantee at least one targeted card.
// Extra appearance weight (in %) per tag. Two sources, added together:
//  - cards obtained during this run (starting deck excluded), when the setting is on
//  - relics that name a favoured tag (always active while the relic is owned)
function tagBonusPctMap(){
  const map = {}, r = S.run;
  if(!r) return map;
  if(S.settings.tagAffinityEnabled){
    const per = S.settings.tagAffinityPct||0;
    (r.acquiredCardIds||[]).forEach(id=>{
      const c = S.cards.find(x=>x.id===id);
      ((c && c.tags) || []).forEach(t=>{ map[t] = (map[t]||0) + per; });
    });
  }
  ((r.player && r.player.relics) || []).forEach(rid=>{
    const rel = S.relics.find(x=>x.id===rid);
    if(rel && rel.favorTag && rel.favorPct>0) map[rel.favorTag] = (map[rel.favorTag]||0) + rel.favorPct;
  });
  return map;
}
function noteCardAcquired(r, cardId){
  if(!r.acquiredCardIds) r.acquiredCardIds = [];
  r.acquiredCardIds.push(cardId);
}
function weightedPickCard(excludeIds, focusTag, onlyFocus){
  let pool = S.cards.filter(c=> c.rarity!=='basic' && !isNonRewardCard(c) && !excludeIds.includes(c.id));
  if(focusTag && onlyFocus){
    const tagged = pool.filter(c=>c.tags && c.tags.includes(focusTag));
    if(tagged.length) pool = tagged;
  }
  if(pool.length===0) return null;
  const bonus = tagBonusPctMap();
  const weightOf = (c)=>{
    const pct = (c.tags||[]).reduce((sum,t)=> sum + (bonus[t]||0), 0);
    return (RARITY_WEIGHT[c.rarity]||10) * ((focusTag && c.tags && c.tags.includes(focusTag)) ? 8 : 1) * (1 + pct/100);
  };
  const total = pool.reduce((sum,c)=> sum + weightOf(c), 0);
  let x = Math.random()*total;
  for(const c of pool){
    x -= weightOf(c);
    if(x<=0) return c;
  }
  return pool[pool.length-1];
}

function threeRewardCards(){
  const picks = [];
  const used = [];
  for(let i=0;i<3;i++){
    const c = weightedPickCard(used);
    if(!c) break;
    picks.push(c); used.push(c.id);
  }
  return picks;
}

// Card-reward choices (ids). With a focus tag the first slot is guaranteed to be a
// tagged card (if one exists) and the rest are weighted heavily toward it.
function generateRewardChoices(r, focusTag){
  const n = 3 + (r.player.extraRewardChoices||0);
  const ids = [], used = [];
  for(let i=0;i<n;i++){
    const c = weightedPickCard(used, focusTag, !!focusTag && i===0);
    if(!c) break;
    ids.push(c.id); used.push(c.id);
  }
  return ids;
}
function generateShopOffers(){
  const offers = [], used = [];
  for(let i=0;i<3;i++){
    const c = weightedPickCard(used);
    if(!c) break;
    used.push(c.id);
    offers.push({cardId:c.id, price:shopPrice(c.rarity), sold:false});
  }
  return offers;
}
function rewardableTags(){
  const set = new Set();
  S.cards.forEach(c=>{ if(c.rarity!=='basic' && !isNonRewardCard(c) && c.tags) c.tags.forEach(t=>set.add(t)); });
  return [...set].sort();
}
// A reroll token is spent first; otherwise the gold price is paid. Returns false if unaffordable.
function payReroll(r, goldCost){
  if((r.player.rerollTokens||0)>0){ r.player.rerollTokens--; return true; }
  if(r.player.gold>=goldCost){ r.player.gold -= goldCost; return true; }
  return false;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Draws 3 cards (weighted, without replacement) from the enemy's deck, then picks 1 of
// those 3 (weighted again) to actually be played. The result is stored as e.nextMoveId
// so it can be shown as the intent *before* the enemy's turn resolves, then executed
// unchanged when the turn comes — the roll happens once per decision, not once per look.
function weightedPickFrom(entries){
  const total = entries.reduce((sum,x)=> sum + (x.weight||1), 0);
  let x = Math.random()*total;
  for(const e of entries){ x -= (e.weight||1); if(x<=0) return e; }
  return entries[entries.length-1];
}
// ---- 条件付きの確定行動 ----
// 条件を満たしたとき、通常の抽選の代わりに、指定したカードを次の行動として確定させる。
// 上にあるものほど優先。判定は、敵が次の行動を決めるとき（＝行動を予告するとき）だけ行う。一度予告した行動は、プレイヤーの行動で条件を満たしても変わらない。
const FORCED_SUBJECTS = [
  {key:'turn', label:'敵の行動回数', unit:'回数', cmps:['eq','gte','every']},
  {key:'selfHpPct', label:'敵のHP（最大HPに対する%）', unit:'%', cmps:['lte','gte']},
  {key:'playerHpPct', label:'プレイヤーのHP（最大HPに対する%）', unit:'%', cmps:['lte','gte']},
  {key:'selfBlock', label:'敵のブロック', unit:'ブロック量', cmps:['gte','lte']},
  {key:'playerBlock', label:'プレイヤーのブロック', unit:'ブロック量', cmps:['gte','lte']},
  {key:'selfTag', label:'敵が持つ指定タグの状態（スタック数の合計）', unit:'スタック数', cmps:['gte','lte'], tag:true},
  {key:'playerTag', label:'プレイヤーが持つ指定タグの状態（スタック数の合計）', unit:'スタック数', cmps:['gte','lte'], tag:true},
];
const FORCED_CMP_LABELS = {
  turn:{eq:'ちょうどこの回数目の行動', gte:'この回数目以降の行動', every:'この回数ごと（倍数回目）'},
  val:{gte:'以上', lte:'以下'},
};
function cleanForcedMoves(list){
  return (Array.isArray(list) ? list : []).filter(x=> x && typeof x==='object' && typeof x.cardId==='string' && S.cards.some(c=>c.id===x.cardId)).map(x=>{
    const subj = FORCED_SUBJECTS.find(s=>s.key===x.subject) || FORCED_SUBJECTS[0];
    return {subject:subj.key, cmp: subj.cmps.includes(x.cmp) ? x.cmp : subj.cmps[0], value: clampInt(x.value,0,9999,0),
      tag: cleanTag(x.tag), cardId:x.cardId, once: !!x.once,
      conflict: CONFLICT_LABELS[x.conflict] ? x.conflict : 'priority'};
  });
}
// ---- 連続行動 ----
// 「この行動が選ばれたら（抽選でも条件でも）、次は必ずこの行動」。選ばれた行動が実行されたあとの次の予告で適用される。
// 条件付きの確定行動と同じ予告で重なったときの扱いは、確定行動ごとに選ぶ。
const CONFLICT_LABELS = {
  priority:'条件の行動を優先する（連続行動は取り消し）',
  ignore:'条件を無視する（連続行動を実行。条件の行動は消費しない）',
  defer:'条件の行動を先送りする（今回は連続行動、次回に条件の行動）',
};
function cleanChains(list){
  return (Array.isArray(list) ? list : []).filter(x=> x && typeof x==='object' && S.cards.some(c=>c.id===x.fromId) && S.cards.some(c=>c.id===x.toId))
    .map(x=>({fromId:x.fromId, toId:x.toId}));
}
function forcedConditionMet(r, e, rule){
  const p = r.player, v = rule.value|0;
  const cmp = cur=> rule.cmp==='lte' ? cur<=v : cur>=v;
  switch(rule.subject){
    case 'turn': { const n = e.rollCount||0; return rule.cmp==='every' ? (v>0 && n%v===0) : (rule.cmp==='gte' ? n>=v : n===v); }
    case 'selfHpPct': return e.maxHp>0 && cmp(e.hp*100/e.maxHp);
    case 'playerHpPct': return p.maxHp>0 && cmp(p.hp*100/p.maxHp);
    case 'selfBlock': return cmp(e.block||0);
    case 'playerBlock': return cmp(p.block||0);
    case 'selfTag': return !!rule.tag && cmp(tagStacks(e, rule.tag));
    case 'playerTag': return !!rule.tag && cmp(tagStacks(p, rule.tag));
  }
  return false;
}
function pickForcedMove(r, e, followPending){
  const rules = e.forcedMoves || [];
  // 先送りされた確定行動は、次の予告で最優先に使う（先送りは1回だけ）
  if(e.deferredIdx>=0){
    const i = e.deferredIdx; e.deferredIdx = -1;
    if(rules[i] && cardById(rules[i].cardId)) return {idx:i, rule:rules[i], fromDefer:true};
  }
  for(let i=0;i<rules.length;i++){
    const rule = rules[i];
    if(!rule || !cardById(rule.cardId)) continue;
    if(rule.once && e.forcedUsed && e.forcedUsed[i]) continue;
    if(!forcedConditionMet(r, e, rule)) continue;
    if(followPending){
      const mode = rule.conflict || 'priority';
      if(mode==='ignore') continue;                          // 無視：この条件は成立しなかったことにする
      if(mode==='defer'){ e.deferredIdx = i; return {defer:true}; } // 先送り：今回は連続行動、次回にこの行動
    }
    return {idx:i, rule};
  }
  return null;
}
// 敵の行動で、カード自身のカード操作を（プレイヤーの次のターン開始時に処理するよう）予約する
function queueEnemyCardOp(r, e, move){
  if(move && move.cardOp && move.cardOp.enabled && r.player.hp>0){
    const op = {...move.cardOp, fromEnemy:true};
    queueTurnStartOp(r, op, `${e.name}の「${move.name}」`);
    const t = enemyOpText(op);
    r.pendingTurnStartOps[r.pendingTurnStartOps.length-1].label = `${e.name}の「${move.name}」${t?': '+t:''}`;
  }
}
// 戦闘開始時に、設定された順で敵がカードを使う（主に「仕込み」タイミングのカード）
function runEnemyStartCards(r){
  const e = r.enemy;
  (e.startCards||[]).forEach(id=>{
    if(e.hp<=0 || r.player.hp<=0) return;
    const c = cardById(id);
    if(!c) return;
    pushLog(`${e.name}は戦闘開始時に「${c.name}」を使った。`);
    resolveEnemyMoveEffects(r, e, c);
    queueEnemyCardOp(r, e, c);
  });
}
function rollEnemyMove(e){
  e.rollCount = (e.rollCount||0) + 1;
  e.nextForced = false;
  const follow = (e.followId && cardById(e.followId)) ? e.followId : '';   // 前の行動による「次は必ずこの行動」
  e.followId = '';
  const forced = S.run ? pickForcedMove(S.run, e, !!follow) : null;
  let id = '';
  if(forced && !forced.defer){
    if(forced.rule.once){ e.forcedUsed = e.forcedUsed || {}; e.forcedUsed[forced.idx] = true; }
    e.nextForced = true;
    id = forced.rule.cardId;
  } else if(follow){
    id = follow;
  } else {
    const deck = e.deck || [];
    if(deck.length===0) id = 'strike';
    else {
      const pool = deck.slice();
      const drawn = [];
      for(let i=0;i<3 && pool.length>0;i++){
        const idx = Math.floor(Math.random()*pool.length);
        drawn.push(pool[idx]);
        pool.splice(idx, 1);
      }
      id = weightedPickFrom(drawn).cardId;
    }
  }
  // 選ばれた行動に連続行動が設定されていれば、次の予告に持ち越す。
  // 先送りされた確定行動が使われた場合、取り残された連続行動は消さずに残す。
  const ch = (e.chains||[]).find(c=> c.fromId===id && cardById(c.toId));
  e.followId = ch ? ch.toId : ((forced && forced.fromDefer) ? follow : '');
  return id;
}

function makeEnemy(floorIndex){
  const s = S.settings;
  const isElite = (floorIndex % s.eliteEvery === 0);
  const isLast = floorIndex === s.floorCount;
  const category = isLast ? 'boss' : (isElite ? 'elite' : 'normal');
  let pool = S.enemies.filter(e => e.category===category);
  if(pool.length===0) pool = S.enemies.filter(e=>e.category==='normal');
  if(pool.length===0) pool = S.enemies;
  const totalWeight = pool.reduce((sum,e)=> sum + (e.weight||1), 0);
  let x = Math.random()*totalWeight;
  let t = pool[pool.length-1];
  for(const e of pool){ x -= (e.weight||1); if(x<=0){ t = e; break; } }
  const scale = 1 + (Math.max(0,floorIndex-1) * (s.enemyHpScalePct/100));
  const hp = Math.round(t.baseHp * scale);
  const runtimeEnemy = {
    name: t.name, emoji: t.emoji, image: t.image||'', elite: t.category==='elite', boss: t.category==='boss',
    hp, maxHp: hp, block:0, strength:0, dexterity:0, weak:0, vulnerable:0, poison:0, stun:0, thorns:0,
    // copied, so cards added during the battle never touch the enemy's saved definition
    deck: (t.deck && t.deck.length ? t.deck : [{cardId:'strike', weight:1}]).map(x=>({...x})),
    customStatus: {}, triggers: [], startEffect: t.startEffect || {},
    dropRelicId: t.dropRelicId || '', dropCardIds: (t.dropCardIds||[]).slice(),
    startCards: (t.startCards||[]).slice(), forcedMoves: (t.forcedMoves||[]).map(x=>({...x})), forcedUsed: {}, rollCount: 0, nextForced: false,
    chains: (t.chains||[]).map(x=>({...x})), followId: '', deferredIdx: -1,
  };
  runtimeEnemy.nextMoveId = rollEnemyMove(runtimeEnemy);
  return runtimeEnemy;
}

// 冒険の導入文（世界観の設定で入力したときだけ、最初に表示する）
function showIntroThen(next){

    </div>
  </div>`;
  qsa('#startpick-row > div').forEach(wrap=>{
    wrap.querySelector('.card').onclick = ()=> pickStartCard(choices[parseInt(wrap.dataset.idx,10)].id);
  });
}

// ログは新しいものが上。kind: 'hit'(HPが減った) / 'guard'(全部防いだ) / 'deal'(自分の攻撃) / 'sum'(まとめ) / 'turn'(ターン区切り)。
// detail を渡すと、その行の下に小さく内訳を表示する。
const LOG_MAX = 400;
let LOG_EXPANDED = false;
function pushLog(msg, kind, detail){
  let html = kind ? `<span class="lg lg-${kind}">${msg}</span>` : msg;
  if(detail) html += `<span class="lg-sub">${detail}</span>`;
  if(LOG_GROUPS.length){ LOG_GROUPS[LOG_GROUPS.length-1].lines.push(html); return; }
  S.run.log.unshift(html);
  if(S.run.log.length>LOG_MAX) S.run.log.pop();
}
// 結果画面（勝利・報酬・ドロップなど）に付ける、直前の戦闘ログ（折りたたみ）
function battleLogDetails(r, open){
  if(!r || !r.log || !r.log.length) return '';
  return `<details ${open?'open':''} style="margin-top:18px; max-width:620px; width:100%; text-align:left;"><summary style="cursor:pointer; color:var(--parchment-dim); font-size:13px;">今回の戦闘ログ（${r.log.length}件）</summary><div class="log-box expanded">${battleLogHTML(r)}</div></details>`;
}
function battleLogHTML(r){
  return r.log.map(l=> l.startsWith('<span class="lg lg-turn">')
    ? `<div class="lg-turnrow">${l}</div>`
    : `<div>・${l}</div>`).join('');
}
// ---- 戦闘ログの書式 ----
// 1回の行動（カード使用・敵の行動）は「使用者：カード名」の見出しの下に、効果ごとの行をまとめて1件として残す。
// 効果の行:  {対象} に ダメージ{合計} ({基礎}{±参照増減}{±固定値}{×倍率 状態名}、{N}ブロック)
// 最後に、変化した値を「{対象}：HP 前 → 後」の形でまとめる（多段攻撃なら、最初の前と最後の後）。
const LOG_GROUPS = [];
function logGroupBegin(head){ LOG_GROUPS.push({head, lines:[], res:{}, order:[]}); }
function logResultLine(x){
  const t = `${x.who}：${x.label} ${x.before} → ${x.after}`;
  return x.cls ? `<span class="${x.cls}">${t}</span>` : t;
}
function logGroupEnd(){
  const g = LOG_GROUPS.pop(); if(!g) return;
  g.order.forEach(k=>{ const x = g.res[k]; if(x.before!==x.after) g.lines.push(logResultLine(x)); });
  const html = `<span class="lg lg-head">${g.head}</span>` + g.lines.map(l=>`<span class="lg-line">${l}</span>`).join('');
  if(LOG_GROUPS.length) LOG_GROUPS[LOG_GROUPS.length-1].lines.push(html);
  else S.run.log.unshift(html), (S.run.log.length>LOG_MAX && S.run.log.pop());
}
function logResult(key, who, label, before, after, cls){
  const g = LOG_GROUPS[LOG_GROUPS.length-1];
  if(!g){ if(before!==after) pushLog(logResultLine({who,label,before,after,cls})); return; }
  if(g.res[key]) g.res[key].after = after;
  else { g.res[key] = {who,label,before,after,cls}; g.order.push(key); }
}
function pctMult(pct){ return Math.round((1+pct/100)*1000)/1000; }
function csLabel(entity, kind){
  const names = customEffectsOn(entity, kind).map(x=>x.st.name);
  return names.length ? names.join('・') : '状態';
}
function nSign(n){ return (n>0?'+':'')+n; }
// 計算式。o: {base, scale, flats:[{v,label}], steps, blocked, pierce}
function logExprHTML(o){
  const parts = [`<span class="lg-n">基礎${o.base}</span>`];
  if(o.scale) parts.push(`<span class="lg-sc">${nSign(o.scale)}</span>`);
  let flat = 0; const names = [];
  (o.flats||[]).concat((o.steps||[]).filter(s=>s.t==='flat')).forEach(f=>{
    if(f.v){ flat += f.v; names.push(`${f.label}${nSign(f.v)}`); }
  });
  if(flat) parts.push(`<span class="${flat>0?'lg-fp':'lg-fm'}" title="${names.join(' ')}">${nSign(flat)}</span>`);
  (o.steps||[]).forEach(s=>{ if(s.t==='mult') parts.push(`<span class="lg-n lg-mul">×${s.v} ${s.label}</span>`); });
  let html = parts.join('');
  if(o.blocked>0) html += `、<span class="lg-blk">${o.blocked}ブロック</span>`;
  if(o.pierce) html += '、貫通';
  return html;
}
function logHeadPrefix(name){ return LOG_GROUPS.length ? '' : `${name}：`; }
function logHitLine(name, target, h, o){
  pushLog(`${logHeadPrefix(name)}${target}にダメージ<b>${h.total}</b> (${logExprHTML({...o, steps:h.steps, blocked:h.blocked, pierce:h.pierce && h.blockBefore>0})})`,
    h.hpLoss>0 ? 'hit' : 'guard');
}
// 敵の攻撃1発。info: {base, scale, str}
function logEnemyHit(e, c, h, info){
  logHitLine(`${e.name}：${c.name}`, 'あなた', h, {base:info.base, scale:info.scale, flats:[{v:info.str, label:'強化'}]});
  logResult('p:hp', 'あなた', 'HP', h.hpBefore, h.hpAfter);
  logResult('p:blk', 'あなた', 'ブロック', h.blockBefore, h.blockAfter, 'lg-blk');
}
function logPlayerHit(c, h, base, scale, str){
  logHitLine(c.name, S.run.enemy.name, h, {base, scale, flats:[{v:str, label:'強化'}]});
  const en = S.run.enemy.name;
  logResult('e:hp', en, 'HP', h.hpBefore, h.hpAfter);
  logResult('e:blk', en, 'ブロック', h.blockBefore, h.blockAfter, 'lg-blk');
}
// ブロック獲得。who: 対象名、ent: 'p'|'e'、before/after: 獲得前後のブロック
function logBlockGain(name, who, ent, total, o, before, after){
  pushLog(`${logHeadPrefix(name)}${who}に<span class="lg-blk">ブロック${total}</span> (${logExprHTML(o)})`);
  logResult(ent+':blk', who, 'ブロック', before, after, 'lg-blk');
}
// ダメージ・ブロック以外の効果。書式: {対象}に{効果名}{値} (基礎N±参照増減) → 最後に {対象}：{状態} 前 → 後
// 「従来」書式に切り替えたときは、legacy（旧来の1行）だけを出す。
let LOG_UNIFIED = (()=>{ try{ return localStorage.getItem('logUnified')!=='0'; }catch(e){ return true; } })();
function logStat(o){
  if(!LOG_UNIFIED){ if(o.legacy) pushLog(typeof o.legacy==='function' ? o.legacy(o.v) : o.legacy); return; }
  const shown = o.shown!==undefined ? o.shown : o.v;
  pushLog(`${logHeadPrefix(o.name)}${o.who}に${o.eff}<b>${shown}</b> (${logExprHTML({base:o.base, scale:o.v-o.base})})`);
  logResult(o.key, o.who, o.state||o.eff, o.before, o.after);
}
// 敵の1回の行動で攻撃が2発以上当たったときの、被弾の合計
function logEnemyTurnSummary(r){
  const st = r.enemyTurnStat; r.enemyTurnStat = null;
  if(!st || st.hits<2) return;
  pushLog(`被弾合計: ${st.total}ダメージ（<span class="lg-blk">${st.blocked}ブロック</span>・HP-${st.hpLoss}）`, 'sum');
}

function beginFloor(){
  const r = S.run;
  if(r.battlesSinceSpecial===undefined) r.battlesSinceSpecial = 0;
  const isBoss = r.floor === S.settings.floorCount;
  const isElite = r.floor % S.settings.eliteEvery === 0;
  if(!isBoss && !isElite && r.battlesSinceSpecial>=2){
    r.battlesSinceSpecial = 0;
    const roll = Math.random();
    if(roll < 0.4){ S.screen='rest'; renderRest(); return; }
    else if(roll < 0.75){ S.screen='event'; renderEvent(); return; }
    else{ S.screen='shop'; renderShop(); return; }
  }
  r.battlesSinceSpecial++;
  // Rebuild the full card pool for the new battle: everything in the draw pile,
  // hand, discard pile, and exhaust pile returns and gets reshuffled. This mirrors
  // standard deckbuilder behavior and prevents cards from being lost between floors.
  LOG_GROUPS.length = 0;
  purgeTemporaryCards(r);
  const fullPool = [...r.draw, ...r.hand, ...r.discard, ...r.exhausted];
  r.draw = shuffle(fullPool);
  r.hand = [];
  r.discard = [];
  r.exhausted = [];

  // Temporary strength/dexterity/metallicize/thorns and any lingering statuses are
  // combat-only and reset here; the permanent versions (permStrength/permDexterity/
  // permMetallicize/permThorns) are untouched and carry across the run.
  r.player.strength = 0;
  r.player.dexterity = 0;
  r.player.metallicize = 0;
  r.player.thorns = 0;
  r.player.weak = 0;
  r.player.vulnerable = 0;
  r.player.poison = 0;
  r.player.regen = 0;
  { // 「戦闘後も残す」状態だけは、次の戦闘に持ち越す
    const keep = {};
    (S.customStatuses||[]).forEach(st=>{ const n = r.player.customStatus && r.player.customStatus[st.id]; if(st.persistent && n>0) keep[st.id] = n; });
    r.player.customStatus = keep;
  }
  r.activeTriggers = [];
  r.pendingTurnStartOps = [];

  r.enemy = makeEnemy(r.floor);
  applyEnemyStartEffects(r, r.enemy, r.enemy.startEffect);
  r.player.block = 0; r.player.autoGranted = 0;
  r.log = [];
  r.turnNo = 0;
  pushLog(`${r.enemy.name}が現れた！`);
  applyNextCombatEffects(r);
  runEnemyStartCards(r);
  // 戦闘開始時の状態（開始時の効果・開始時に使ったカード）を踏まえて、最初の予告を引き直す
  r.enemy.rollCount = 0; r.enemy.forcedUsed = {}; r.enemy.followId = ''; r.enemy.deferredIdx = -1;
  r.enemy.nextMoveId = rollEnemyMove(r.enemy);
  startPlayerTurn(true);
  fireRelicTiming(r, 'combatStart');
  S.screen='battle';
  renderBattle();
}

function drawCards(n){
  const r = S.run;
  for(let i=0;i<n;i++){
    if(r.draw.length===0){
      if(r.discard.length===0) return;
      r.draw = shuffle(r.discard);
      r.discard = [];
      pushLog('捨札を山札に戻した。');
    }
    const cid = r.draw.pop();
    r.hand.push(cid);
    applyCardDrawEffect(r, cardById(cid));
    if(r.enemy.hp<=0 || r.player.hp<=0) return; // stop drawing further cards; the caller checks for defeat
  }
}

// A card's "drawn" effect is a second, independent set of the same numeric fields
// (damage/block/buffs/debuffs/heal/...), stored under "dw_"-prefixed keys so it can
// reuse the exact same rendering/upgrade/save machinery as the main effect while never
// colliding with it. It fires once whenever this specific card is moved into hand by a
// draw — whether or not it's ever played. Custom statuses, cardOp, hits (repeat count)
// and per-field scaling are not supported here, to keep a passive, always-on trigger safe.
function drawEffectFieldDefs(){
  return EFFECT_FIELD_DEFS.filter(d=>d.key!=='hits').map(def=>({...def, key:'dw_'+def.key, _base:def.key}));
}
function fxPickerHTML(group, title){
  return `<div class="ev-add fx-picker" data-group="${group}" style="margin:8px 0;"><select class="fx-pick" aria-label="${title}"></select><button type="button" class="fx-add">＋ ${title}を追加</button></div>`;
}
function applyCardDrawEffect(r, c){
  if(!c) return;
  const defs = drawEffectFieldDefs();
  const temp = {name: c.name};
  let hasAny = false;
  defs.forEach(def=>{
    const v = c[def.key]||0;
    if(v>0) hasAny = true;
    temp[def._base] = v;
  });
  if(hasAny) applyEffectValues(r, temp);
}

function startPlayerTurn(first){
  const r = S.run;
  r.turnNo = (r.turnNo||0) + 1;
  pushLog(`ターン${r.turnNo}`, 'turn');
  if(r.player.poison>0){
    const hpBefore = r.player.hp, pv = r.player.poison;
    r.player.hp = Math.max(0, r.player.hp - pv);
    pushLog(`毒によって${pv}ダメージを受けた（HP ${hpBefore}→${r.player.hp}。毒は${pv-1}に減少）。`, 'hit');
    r.player.poison--;
    if(playerFallen()){ onPlayerDefeated(); return; }
  }
  if(r.player.regen>0){
    r.player.hp = Math.min(r.player.maxHp, r.player.hp + r.player.regen);
    pushLog(`再生によってHPを${r.player.regen}回復した。`);
    r.player.regen--;
  }
  r.player.block = 0;
  const autoBlock = r.player.metallicize + r.player.permMetallicize;
  if(autoBlock>0){ r.player.block += autoBlock; }
  const customSkip = tickCustomStatusesForTurn(r.player);
  r.player.autoGranted = r.player.block; // このターン開始時に自動ブロックで入った分（表示で「ブロック+自動」を分けるため）
  if(playerFallen()){ onPlayerDefeated(); return; }
  if(!first){
    // discard hand from previous turn, except cards flagged "retain"
    const keep = [];
    const toDiscard = [];
    r.hand.forEach(cid=>{
      const c = cardById(cid);
      if(c && c.retain) keep.push(cid); else toDiscard.push(cid);
    });
    r.discard.push(...toDiscard);
    r.hand = keep;
  }
  r.player.energy = S.settings.energyPerTurn + (r.player.extraEnergy||0);
  r.cardsPlayedThisTurn = 0;
  r.tagsPlayedThisTurn = [];
  if(r.activeTriggers) r.activeTriggers = r.activeTriggers.filter(t=>t.duration!=='turn');
  drawCards(S.settings.handSize + (r.player.extraDraw||0));
  if(enemyFallen()){ onEnemyDefeated(); return; }
  if(playerFallen()){ onPlayerDefeated(); return; }
  // Card operations queued by statuses / enemy moves resolve now that the hand is drawn.
  // A "choose" operation pauses here until the player picks; the rest of the turn start
  // then continues from the callback (and re-renders, since the caller already has).
  let sync = true;
  runTurnStartCardOps(r, ()=>{
    if(enemyFallen()){ onEnemyDefeated(); return; }
    if(playerFallen()){ onPlayerDefeated(); return; }
    fireRelicTiming(r, 'turnStart');
    r.turnPhase='player';
    // 行動不能でも自動でターンは送らない。カードは使えないので、敵の予告やログを確認してから手動でターン終了する。
    r.turnSkipped = !!customSkip;
    if(customSkip) pushLog('行動できない！ カードは使えない。敵の行動を確認して、ターンを終了してください。');
    if(!sync) renderBattle();
  });
  sync = false;
}

function applyDamageToEnemy(raw, pierce, onHit){
  const r = S.run; const e = r.enemy;
  let dmg = raw;
  const steps = [];
  const dealtBonus = customDamageDealtBonus(r.player);
  if(dealtBonus.flat){ dmg += dealtBonus.flat; steps.push({t:'flat', v:dealtBonus.flat, label:csLabel(r.player,'damageDealtFlat')}); }
  if(r.player.weak>0){ dmg = Math.floor(dmg*0.75); steps.push({t:'mult', v:0.75, label:'弱体'}); }
  if(dealtBonus.pct){ dmg = Math.max(0, Math.floor(dmg*(1+dealtBonus.pct/100))); steps.push({t:'mult', v:pctMult(dealtBonus.pct), label:csLabel(r.player,'damageDealtPct')}); }
  if(e.vulnerable>0){ dmg = Math.floor(dmg*1.5); steps.push({t:'mult', v:1.5, label:'脆弱'}); }
  const takenFlat = customDamageTakenFlat(e);
  if(takenFlat && dmg>0){ dmg = Math.max(0, dmg + takenFlat); steps.push({t:'flat', v:takenFlat, label:csLabel(e,'damageTakenFlat')}); }
  const takenPct = customDamageTakenPct(e);
  if(takenPct){ dmg = Math.max(0, Math.floor(dmg*(1+takenPct/100))); steps.push({t:'mult', v:pctMult(takenPct), label:csLabel(e,'damageTakenPct')}); }
  dmg = Math.max(0, dmg);
  const hpBefore = e.hp, blockBefore = e.block;
  let blocked = 0;
  if(!pierce){ blocked = Math.min(e.block, dmg); e.block -= blocked; dmg -= blocked; }
  e.hp = Math.max(0, e.hp - dmg);
  const hit = {raw, steps, total: dmg+blocked, blocked, hpLoss: dmg, pierce: !!pierce, hpBefore, hpAfter: e.hp, blockBefore, blockAfter: e.block};
  r.lastEnemyHit = hit;
  if(onHit) onHit(hit);   // 敵の構え（トリガー）のログより先に、この攻撃のログを残すため
  if(dmg+blocked>0) fireEnemyTriggers(r, 'damaged', {hpLoss: dmg, total: dmg+blocked});
  return dmg+blocked;
}
// 敵の攻撃1発あたり、プレイヤーが受けるダメージ（ブロックを引く前）を計算する。状態は変更しない。
// 実際の処理（applyDamageToPlayer）と行動予告の予測の両方がこれを使うので、予告と結果がずれにくい。
// opts.vulnerable: プレイヤーの脆弱の残りターン数を仮定して計算したいとき（予測用）
function calcPlayerDamage(raw, opts){
  opts = opts||{};
  const r = S.run, p = r.player, en = r.enemy;
  const vuln = opts.vulnerable!==undefined ? opts.vulnerable : p.vulnerable;
  const steps = [];
  let dmg = raw;
  const dealtBonus = customDamageDealtBonus(en);
  if(dealtBonus.flat){ dmg += dealtBonus.flat; steps.push({t:'flat', v:dealtBonus.flat, label:csLabel(en,'damageDealtFlat')}); }
  if(en.weak>0){ dmg = Math.floor(dmg*0.75); steps.push({t:'mult', v:0.75, label:'弱体'}); }
  if(dealtBonus.pct){ dmg = Math.max(0, Math.floor(dmg*(1+dealtBonus.pct/100))); steps.push({t:'mult', v:pctMult(dealtBonus.pct), label:csLabel(en,'damageDealtPct')}); }
  if(vuln>0){ dmg = Math.floor(dmg*1.5); steps.push({t:'mult', v:1.5, label:'脆弱'}); }
  const takenFlat = customDamageTakenFlat(p);
  if(takenFlat && dmg>0){ dmg = Math.max(0, dmg + takenFlat); steps.push({t:'flat', v:takenFlat, label:csLabel(p,'damageTakenFlat')}); }
  const takenPct = customDamageTakenPct(p);
  if(takenPct){ dmg = Math.max(0, Math.floor(dmg*(1+takenPct/100))); steps.push({t:'mult', v:pctMult(takenPct), label:csLabel(p,'damageTakenPct')}); }
  return {raw, total: Math.max(0, dmg), steps};
}
function applyDamageToPlayer(raw, pierce){
  const r = S.run; const p = r.player;
  const calc = calcPlayerDamage(raw);
  const total = calc.total;
  const hpBefore = p.hp, blockBefore = p.block;
  const blocked = pierce ? 0 : Math.min(p.block, total);   // 貫通なら、ブロックを無視する
  p.block -= blocked;
  const hpLoss = total - blocked;
  p.hp = Math.max(0, p.hp - hpLoss);
  r.lastHit = {raw, steps: calc.steps, hpLoss, total, blocked, pierce: !!pierce, hpBefore, hpAfter: p.hp, blockBefore, blockAfter: p.block};
  return total;
}

function playCard(handIdx){
  const r = S.run; if(r.turnPhase!=='player' || r.turnSkipped) return;
  const cardId = r.hand[handIdx];
  const c = cardById(cardId);
  if(!c || c.cost > r.player.energy) return;
  r.player.energy -= c.cost;

  // The played card leaves the hand BEFORE its effects resolve. Otherwise a hand-targeting
  // card operation (discard / buff / upgrade / duplicate ...) could pick the card that is
  // being played; and since buffing re-tags a card with a new instance id, the card would
  // then end up both in the hand (buffed) and in the discard pile (original) — two copies.
  r.hand.splice(handIdx,1);

  logGroupBegin(`あなた：${cardIcon(c)}${c.name}`);
  resolveCardPlayCore(r, c, ()=>{
    logGroupEnd();
    if(c.exhaust){ r.exhausted.push(cardId); }
    else{ r.discard.push(cardId); }

    if(enemyFallen()){ onEnemyDefeated(); return; }
    if(playerFallen()){ onPlayerDefeated(); return; }
    renderBattle();
  });
}

function endPlayerTurn(){
  const r = S.run; if(r.turnPhase!=='player') return;
  // tick down player debuffs at end of player's turn
  if(r.player.weak>0) r.player.weak--;
  if(r.player.vulnerable>0) r.player.vulnerable--;
  r.turnPhase='enemy';
  renderBattle();
  setTimeout(runEnemyTurn, 550);
}

function runEnemyTurn(){
  const r = S.run; const e = r.enemy;
  if(r.ended) return;
  pushLog(`ターン${r.turnNo||1}・${e.name}の行動`, 'turn');
  // poison at start of enemy turn
  if(e.poison>0){
    const eBefore = e.hp, pv = e.poison;
    e.hp = Math.max(0, e.hp - pv);
    pushLog(`${e.name}は毒で${pv}ダメージ（敵HP ${eBefore}→${e.hp}。毒は${pv-1}に減少）。`, 'deal');
    e.poison--;
    if(enemyFallen()){ onEnemyDefeated(); return; }
  }
  const customSkip = tickCustomStatusesForTurn(e);
  if(enemyFallen()){ onEnemyDefeated(); return; }
  if(e.stun>0){
    e.stun--;
    pushLog(`${e.name}は麻痺していて行動できない。`);
    enemyTurnTail(r, e);
  } else if(customSkip){
    pushLog(`${e.name}は行動できない。`);
    enemyTurnTail(r, e);
  } else {
    const move = cardById(e.nextMoveId);
    r.damageEvents = [];
    e.triggers = (e.triggers||[]).filter(t=>t.duration!=='turn'); // 「このターンのみ」の構えは、次の行動の前に解ける
    r.enemyTurnStat = {hits:0, total:0, blocked:0, hpLoss:0, hpStart:r.player.hp};
    if(move) resolveEnemyMoveEffects(r, e, move);
    logEnemyTurnSummary(r);
    // ダメージを受けたときのトリガー（カード操作で選択画面が出る場合は、選び終わってから続きへ）
    fireDamageTriggers(r, ()=>{
      // Resolved at the start of the player's next turn, once the new hand is drawn (視点反転: resolveEnemyCardOp).
      queueEnemyCardOp(r, e, move);
      if(enemyFallen()){ onEnemyDefeated(); return; }
      if(playerFallen()){ onPlayerDefeated(); return; }
      e.nextMoveId = rollEnemyMove(e);
      enemyTurnTail(r, e);
    });
  }
}
function enemyTurnTail(r, e){
  if(e.weak>0) e.weak--;
  if(e.vulnerable>0) e.vulnerable--;
  if(playerFallen()){ onPlayerDefeated(); return; }
  startPlayerTurn(false);
  renderBattle();
}

function goldForFloor(floorIndex, elite, boss){
  let base = 15 + floorIndex*3;
  if(boss) base *= 2.2;
  else if(elite) base *= 1.6;
  return Math.round(base * (0.85 + Math.random()*0.3));
}

function onEnemyDefeated(){
  const r = S.run;
  r.rewardChoices = null; r.rewardRerollCount = 0; r.rewardFocusTag = '';
  purgeTemporaryCards(r);
  fireRelicTiming(r, 'combatEnd');
  const gained = goldForFloor(r.floor, r.enemy.elite, r.enemy.boss);
  r.player.gold += gained;
  r.lastGoldGained = gained;
  pushLog(`${r.enemy.name}を撃破した！ ゴールド+${gained}。`);
  if(r.floor >= S.settings.floorCount){
    S.screen='victory'; renderVictory(); return;
  }
  // 敵ごとに設定されたドロップカード（必ず入手）
  r.lastDropCards = [];
  r.pendingDropCards = (r.enemy.dropCardIds||[]).filter(id=>!!cardById(id));
  // 敵ごとに設定されたドロップレリック（未所持のときのみ）。なければ従来のエリート／ボス報酬
  let dropRelic = null;
  if(r.enemy.dropRelicId){
    const fixed = S.relics.find(rel=>rel.id===r.enemy.dropRelicId);
    if(fixed && !r.player.relics.includes(fixed.id)) dropRelic = fixed;
  }
  if(!dropRelic && (r.enemy.elite || r.enemy.boss)){
    const avail = S.relics.filter(rel=>!r.player.relics.includes(rel.id) && !isNonRewardRelic(rel));
    if(avail.length>0) dropRelic = avail[Math.floor(Math.random()*avail.length)];
  }
  r.pendingRelic = dropRelic;
  proceedAfterDrops();
}
// 撃破後の流れ: ドロップカード（受け取る/拒否）→ レリック（手に入れる/見送る）→ 通常の報酬
function proceedAfterDrops(){
  const r = S.run;
  if(r.pendingDropCards && r.pendingDropCards.length){ S.screen='dropCards'; renderDropCards(); return; }
  if(r.pendingRelic){ S.screen='relicReward'; renderRelicReward(); return; }
  S.screen='reward'; renderReward();
}
function renderDropCards(){
  const r = S.run;
  const ids = r.pendingDropCards;
  if(!r.dropSelected || r.dropSelected.length!==ids.length) r.dropSelected = ids.map(()=>true);
  const sel = r.dropSelected;
  const n = sel.filter(Boolean).length;
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">DROP</p>
    <h2>${escapeHtml(r.enemy.name)}が落としたカード</h2>
    <p style="color:var(--parchment-dim); margin-top:6px;">受け取るカードを選んでください（クリックで切り替え）。</p>
    <div class="reward-row" id="drop-row">
      ${ids.map((id,i)=>`<div data-idx="${i}" style="cursor:pointer; ${sel[i]?'outline:3px solid var(--gold); border-radius:10px;':'opacity:.4;'}">${renderCardHTML(cardById(id),{mini:true})}</div>`).join('')}
    </div>
    <div style="margin-top:14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="primary" id="btn-drop-take" ${n===0?'disabled':''}>選んだ${n}枚を受け取る</button>
      <button class="ghost" id="btn-drop-none">すべて受け取らない</button>
    </div>
    ${battleLogDetails(r, false)}
  </div>`;
  qsa('#drop-row > div').forEach(w=>{
    w.onclick = ()=>{ const i = parseInt(w.dataset.idx,10); sel[i] = !sel[i]; renderDropCards(); };
  });
  const finish = (take)=>{
    const got = [];
    ids.forEach((id,i)=>{
      if(take && sel[i]){ r.discard.push(id); noteCardAcquired(r, id); got.push(cardById(id).name); }
    });
    r.lastDropCards = got;
    if(got.length) pushLog(`ドロップ: ${got.join('、')}をデッキに加えた。`);
    r.pendingDropCards = null; r.dropSelected = null;
    proceedAfterDrops();
  };
  qs('#btn-drop-take').onclick = ()=>finish(true);
  qs('#btn-drop-none').onclick = ()=>finish(false);
}
function onPlayerDefeated(){
  S.run.ended = true;
  S.screen='defeat';
  renderDefeat();
}

function statusChips(entity){
  const chips = [];
  if(entity.strength) chips.push(`💪 強化 ${entity.strength}`);
  if(entity.dexterity) chips.push(`🤸 器用 ${entity.dexterity}`);
  if(entity.weak) chips.push(`😮‍💨 弱体 ${entity.weak}`);
  if(entity.vulnerable) chips.push(`🎯 脆弱 ${entity.vulnerable}`);
  if(entity.poison) chips.push(`☠️ 毒 ${entity.poison}`);
  if(entity.regen) chips.push(`✨ 再生 ${entity.regen}`);
  if(entity.stun) chips.push(`💫 麻痺 ${entity.stun}`);
  if(entity.metallicize) chips.push(`🛡️ 自動 ${entity.metallicize}`);
  if(entity.thorns) chips.push(`🌵 棘 ${entity.thorns}`);
  if(entity.customStatus){
    (S.customStatuses||[]).forEach(st=>{
      const v = entity.customStatus[st.id];
      if(v) chips.push(`${st.emoji||'❔'} ${st.name} ${v}`);
    });
  }
  (entity.triggers||[]).forEach(t=> chips.push(`⚡ 構え：${escapeHtml(t.card.name)}`));
  return chips.map(c=>`<span class="status-chip">${c}</span>`).join('');
}
function intentLabel(e){
  const c = cardById(e.nextMoveId);
  if(!c) return {cls:'buf', text:'予告: ？'};
  // Format: 予告: <icon><skill name> <effect><value>・<effect><value>...
  // 数値は、敵の現在の強化・器用や、参照増減（失ったHPなど）を反映した値を表示する。
  const V = key=> enemyVal(c, key);
  const parts = [];
  const hits = Math.max(1, (c.hits||1) + scaleBonus(c,'hits','enemy'));
  if(V('block')>0) parts.push(`ブロック${Math.max(0, V('block') + customBlockGainBonus(e))}`);
  const str = V('strength')+V('permStrength');
  if(str>0) parts.push(`強化${str}`);
  const dex = V('dexterity')+V('permDexterity');
  if(dex>0) parts.push(`器用${dex}`);
  const met = V('metallicize')+V('permMetallicize');
  if(met>0) parts.push(`自動ブロック${met}`);
  const thr = V('thorns')+V('permThorns');
  if(thr>0) parts.push(`棘${thr}`);
  if(V('weak')>0) parts.push(`弱体${V('weak')}`);
  if(V('vulnerable')>0) parts.push(`脆弱${V('vulnerable')}`);
  if(V('poison')>0) parts.push(`毒${V('poison')}`);
  if(V('heal')>0) parts.push(`回復${V('heal')}`);
  if(c.regen>0) parts.push(`再生${c.regen}`);
  customStatusFieldDefs().forEach(def=>{
    const amt = (c[def.key]||0) + scaleBonus(c, def.key, 'enemy');
    const st = (S.customStatuses||[]).find(x=>x.id===def._statusId);
    if(!st) return;
    const both = csGrantSide(c, st)==='both';
    const extra = both ? ((c['csX_'+st.id])|0) : 0;
    if(both){
      if(amt!==0) parts.push(`${st.emoji||''}${st.name}${amt}（自分に）`);
      if(extra!==0) parts.push(`${st.emoji||''}${st.name}${extra}（相手に）`);
    } else if(amt!==0){
      parts.push(`${st.emoji||''}${st.name}${amt}`);
    }
  });
  { const so = statusOpText(c.statusOp); if(so) parts.push(so); }
  if(c.cardOp && c.cardOp.enabled){
    const t = enemyOpText(c.cardOp);
    if(t) parts.push(t);
  }
  const isTrig = c.timing==='trigger';
  const cls = isTrig ? 'buf' : (V('damage')>0 ? 'atk' : (V('block')>0 ? 'def' : 'buf'));
  let trigText = '';
  if(isTrig){
    const when = c.triggerOn==='damaged' ? 'ダメージを受けたとき' : `${c.triggerTag?`[${c.triggerTag}]の`:''}カードを使ったとき`;
    trigText = `【構え：${when}】`;
  }
  const pred = isTrig ? null : predictEnemyAttack(e, c);
  // 表記: {カード名}：ダメージ {予測合計}({基礎}×{回数})・その他の効果…（詳細はポップオーバー）
  const all = parts.slice();
  if(pred) all.unshift(`${pred.lethal?'<span class="warn">⚠</span>':''}ダメージ <b>${pred.total}</b>${pred.hits>1?`<span class="ip-calc">(${V('damage')}×${pred.hits})</span>`:(V('damage')!==pred.total?`<span class="ip-calc">(${V('damage')})</span>`:'')}`);
  const text = `${cardIcon(c)}${escapeHtml(c.name)}${trigText}：${all.length?all.join('・'):'―'}`;
  const pop = `<div class="intent-pop">
    <div class="ip-title">${cardIcon(c)}${escapeHtml(c.name)}${trigText}</div>
    ${parts.length?`<div class="ip-parts">${parts.join('・')}</div>`:''}
    ${pred ? predictionPopHTML(e, c, pred) : ''}
  </div>`;
  return {cls, text, pop, lethal: !!(pred && pred.lethal)};
}

// 敵の攻撃を、実際の処理（applyEnemyCardPayload）と同じ順序でシミュレートして、被ダメージを予測する。
// 反映するもの: 強化・弱体・脆弱・状態異常の増減、多段攻撃での「1発ごとの強化の積み上がり」「同じ行動で脆弱が付く場合の後続ヒット」、
//              現在のブロック（1発ごとに減っていく）、貫通、プレイヤーのターン終了時に脆弱が1減る処理。
// 反映しないもの: 敵の構え（トリガー）による追加攻撃、敵のターン開始時の状態の変化、プレイヤーの仕込みの効果。
function predictEnemyAttack(e, c){
  const r = S.run, p = r.player;
  const V = key=> enemyVal(c, key);
  const base = V('damage');
  if(c.timing==='trigger' || base<=0) return null;
  const hits = Math.max(1, (c.hits||1) + scaleBonus(c,'hits','enemy'));
  const strGain = V('strength') + V('permStrength');   // 同じ行動で強化を得るなら、1発ごとに積み上がる
  const vulnGain = V('vulnerable');                    // 同じ行動で脆弱を付けるなら、2発目以降に効く
  const ticking = r.turnPhase==='player' && p.vulnerable>0;
  let vuln = r.turnPhase==='player' ? Math.max(0, p.vulnerable-1) : p.vulnerable;   // ターン終了時に脆弱が1減ってから、敵が動く
  const vulnStart = vuln;
  let blk = p.block, hp = p.hp, strAdd = 0;
  const rows = [];
  for(let i=0; i<hits && hp>0; i++){
    const calc = calcPlayerDamage(base + e.strength + strAdd, {vulnerable: vuln});
    const blocked = c.pierce ? 0 : Math.min(blk, calc.total);
    blk -= blocked;
    const loss = calc.total - blocked;
    hp = Math.max(0, hp - loss);
    rows.push({total: calc.total, blocked, loss, steps: calc.steps, str: e.strength + strAdd, hpAfter: hp});
    strAdd += strGain;
    if(vulnGain>0) vuln += vulnGain;
  }
  const sum = k=> rows.reduce((a,x)=>a+x[k],0);
  const total = sum('total');
  return {base, hits, rows, total, blocked: sum('blocked'), loss: sum('loss'), strGain, newVuln: vulnGain>0 && vulnStart<=0,
          hpBefore: p.hp, hpAfter: hp, blockBefore: p.block, blockAfter: blk,
          lethal: hp<=0, pierce: !!c.pierce, needBlock: c.pierce ? 0 : Math.max(0, total - p.block),
          vulnNote: ticking ? `あなたの脆弱${p.vulnerable}は、ターン終了時に${vulnStart}へ減る前提` : ''};
}
// ポップオーバー: 1発ごとの計算（基礎・参照増減・固定値・倍率・ブロック）と、最終的なHP・ブロックの変化
function predictionPopHTML(e, c, pr){
  const printed = c.damage||0, scale = pr.base - printed;
  let html = pr.rows.map((x,i)=>{
    const expr = logExprHTML({base:printed, scale, flats:[{v:x.str, label:'強化'}], steps:x.steps, blocked:x.blocked, pierce:pr.pierce && pr.blockBefore>0});
    const res = x.loss>0 ? `HP-${x.loss}` : (x.total>0 ? 'HP変化なし' : '');
    return `<div class="ip-row"><span class="ip-k">${i+1}発目</span>ダメージ<b>${x.total}</b> (${expr}) <span class="ip-k">${res}</span></div>`;
  }).join('');
  let sum = `ダメージ合計 <b>${pr.total}</b>`;
  if(pr.total<=0) sum += '（ダメージなし）';
  html += `<div class="ip-sum">${sum}${pr.lethal?' <span class="warn">⚠ 致死</span>':''}
    <div>あなた：HP ${pr.hpBefore} → ${pr.hpAfter}</div>
    ${pr.blockBefore!==pr.blockAfter?`<div class="lg-blk">あなた：ブロック ${pr.blockBefore} → ${pr.blockAfter}</div>`:''}</div>`;
  const notes = [];
  if(pr.rows.length>1 && pr.strGain>0) notes.push(`1発ごとに強化+${pr.strGain}`);
  if(pr.rows.length>1 && pr.newVuln) notes.push('この攻撃で脆弱が付くため、2発目以降は×1.5');
  if(pr.pierce) notes.push('貫通（ブロック無視）');
  else if(pr.loss>0) notes.push(`完全に防ぐには、あと${pr.needBlock}ブロック`);
  if(pr.vulnNote) notes.push(pr.vulnNote);
  notes.push('敵の構え・ターン開始時の状態変化は含みません');
  html += `<div class="ip-note">${notes.join('／')}</div>`;
  return html;
}

function renderCardChoiceOverlay(r){
  const pc = r.pendingChoice;
  const selected = pc.selectedIdx;
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">CHOICE</p>
    <h2>カードを選択（${selected.length} / ${pc.need}）</h2>
    ${pc.prompt ? `<p style="color:var(--parchment-dim); margin:6px 0 10px;">${escapeHtml(pc.prompt)}</p>` : ''}
    <div class="reward-row" id="choice-row">
      ${pc.candidates.map((e,i)=>{
        const c = cardById(e.rawId);
        if(!c) return '';
        const picked = selected.includes(i);
        return `<div data-idx="${i}" style="text-align:center; cursor:pointer; ${picked?'outline:3px solid var(--gold); border-radius:10px;':''}">
          ${renderCardHTML(c,{})}
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:18px;">
      <button class="primary" id="btn-choice-confirm" ${selected.length!==pc.need?'disabled':''}>決定</button>
    </div>
  </div>`;
  qsa('#choice-row > div').forEach(wrap=>{
    wrap.onclick = ()=>{
      const i = parseInt(wrap.dataset.idx,10);
      const pos = selected.indexOf(i);
      if(pos>=0) selected.splice(pos,1);
      else if(selected.length < pc.need) selected.push(i);
      renderCardChoiceOverlay(r);
    };
  });
  qs('#btn-choice-confirm').onclick = ()=>{
    if(selected.length!==pc.need) return;
    const chosen = selected.map(i=>pc.candidates[i]);
    r.pendingChoice = null;
    pc.onConfirm(chosen);
  };
}

let INTENT_OPEN = false;
// ブロック欄: ブロックが1以上、または次のターン開始時に自動ブロックが入るときだけ中身を出す。場所は常に確保して、画面がずれないようにする。
function hpBarHTML(ent){
  const auto = (ent.metallicize||0) + (ent.permMetallicize||0) + customEffectSum(ent,'autoBlock');
  const on = ent.block>0 || auto>0;
  // プレイヤーは、ターン開始時に自動ブロックで入った分を「ブロック」から除いて表示する（0+1のように）
  const shownBlock = auto>0 ? Math.max(0, ent.block - (ent.autoGranted||0)) : ent.block;
  const badge = on
    ? `<div class="hpbar-block">🛡${shownBlock}${auto>0?`<span class="blk-auto" title="次の自分のターン開始時に自動で入るブロック">+${auto}</span>`:''}</div>` : '';
  return `<div class="hpbar-wrap${on?' has-block':''}"><div class="hpbar-fill" style="width:${Math.max(0,100*ent.hp/ent.maxHp)}%"></div><div class="hpbar-text"><span>${ent.hp} / ${ent.maxHp}</span>${badge}</div></div>`;
}

  { const b = qs('#btn-log-size'); if(b) b.onclick = ()=>{ LOG_EXPANDED = !LOG_EXPANDED; renderBattle(); }; }
  qs('#btn-log-side').onclick = ()=>{ LOG_SIDE = LOG_SIDE==='right' ? 'bottom' : 'right'; try{ localStorage.setItem('logSide', LOG_SIDE); }catch(e){} renderBattle(); };
  qs('#btn-log-fmt').onclick = ()=>{ LOG_UNIFIED = !LOG_UNIFIED; try{ localStorage.setItem('logUnified', LOG_UNIFIED?'1':'0'); }catch(e){} renderBattle(); };
}

    <div style="margin-top:26px;">
      <button class="primary" id="btn-rest-heal">火を囲んで休む（HP +${healAmt}）</button>
    </div>
    <div style="margin-top:12px;">
      <button class="ghost" id="btn-rest-skip">そのまま先へ進む</button>
    </div>
  </div>`;
  const advance = ()=>{ r.floor++; beginFloor(); };
  qs('#btn-rest-heal').onclick = ()=>{
    r.player.hp = Math.min(r.player.maxHp, r.player.hp + healAmt);
    advance();
  };
  qs('#btn-rest-skip').onclick = advance;
}

function ownedCardInstances(r){
  const list = [];
  r.draw.forEach((cid,i)=>list.push({cid,pile:'draw',i}));
  r.hand.forEach((cid,i)=>list.push({cid,pile:'hand',i}));

const RELIC_TIMINGS = [
  {key:'onPickup', label:'即時（入手時。カードと自分への効果のみ・1回だけ）'},
  {key:'combatStart', label:'戦闘開始時'},
  {key:'turnStart', label:'ターン開始時'},
  {key:'combatEnd', label:'戦闘終了時'},
  {key:'onTagCardUsed', label:'指定タグのカード使用時'},
];
// Meta fields that aren't part of a card's own effect vocabulary — they only make
// sense as a one-time acquisition bonus (onPickup), except goldBonus which also
// works as a recurring "gain gold on victory" combat-end effect.
const RELIC_META_FIELDS = [
  {key:'maxHpBonus', label:'最大HP+（永続、即時回復も含む）', max:99, desc:(v)=>`最大HP+${v}`},
  {key:'goldBonus', label:'ゴールド+', max:999, desc:(v)=>`ゴールド+${v}`},
  {key:'extraEnergy', label:'毎ターンのエネルギー+（永続）', max:9, desc:(v)=>`毎ターンのエネルギー+${v}`},
  {key:'extraDraw', label:'毎ターンのドロー+（永続）', max:9, desc:(v)=>`毎ターンのドロー+${v}`},
  {key:'extraRewardChoices', label:'カード報酬の選択肢+（永続）', max:5, desc:(v)=>`カード報酬の選択肢+${v}`},
  {key:'rerollTokens', label:'リロールトークン+', max:20, desc:(v)=>`リロールトークン+${v}`},
];
// Which effect fields make sense for a given relic timing. onPickup fires once, outside
// any particular combat, and only ever affects the player themself or their deck — never
// the enemy — so every enemy-targeting / combat-only field is excluded there. The
// recurring timings (every combat start/turn start/tag-use, and combat end) share the
// full card effect vocabulary instead, minus the "permanent" stat fields (since firing
// those every single combat or every single turn would spiral out of control).
function relicFieldDefsFor(timing){
  if(timing==='onPickup'){
    // カスタム状態は、手に入れた後の「次の戦闘の開始時」に付与される（戦闘外では付与できないため）。
    const allowed = ['permStrength','permDexterity','permMetallicize','permThorns','heal'];
    const pickupStatusDefs = customStatusFieldDefs().map(d=>({...d, label:'次の戦闘の開始時: '+d.label, desc:(v)=>'次の戦闘の開始時に'+d.desc(v)}));
    return [...EFFECT_FIELD_DEFS.filter(d=>allowed.includes(d.key)), ...pickupStatusDefs, ...RELIC_META_FIELDS];
  }
  if(timing==='combatEnd') return combatEndFieldDefs();
  // Recurring timings: the full card vocabulary, plus permanent gains (permanent stats,
  // max HP, energy/draw, ...). Permanent gains add up every time the relic fires.
  return [...allEffectFieldDefs(), ...RELIC_META_FIELDS];
}
// At combat end the enemy is already dead, so damage/block/draw make no sense. What does
// make sense: permanent gains, healing, and buffs/debuffs that are carried over to the
// start of the NEXT battle (statuses are otherwise reset at the start of every battle).
const CE_STATUS_MAP = {
  strength:['p','strength'], dexterity:['p','dexterity'], metallicize:['p','metallicize'], thorns:['p','thorns'], regen:['p','regen'],
  selfWeak:['p','weak'], selfVulnerable:['p','vulnerable'], selfPoison:['p','poison'],
  weak:['e','weak'], vulnerable:['e','vulnerable'], poison:['e','poison'], stun:['e','stun'],
};
const CE_DIRECT_KEYS = ['permStrength','permDexterity','permMetallicize','permThorns','heal','loseHp'];
function combatEndFieldDefs(){
  const tidy = str=> str.replace(/（この戦闘中のみ[^）]*）/,'');
  const out = [];
  allEffectFieldDefs().forEach(d=>{
    if(d.key==='loseHp') out.push({...d, label:'自分へのダメージ（代償。HPは1未満にならない）'});
    else if(CE_DIRECT_KEYS.includes(d.key)) out.push(d);
    else if(CE_STATUS_MAP[d.key] || d._statusId){
      out.push({...d, label:'次の戦闘: '+tidy(d.label), desc:(v)=>'次の戦闘の開始時に'+tidy(d.desc(v))});
    }
  });
  return out.concat(RELIC_META_FIELDS);
}
function relicTimingHint(t){
  if(t==='onPickup') return 'カスタム状態は、手に入れたあと最初の戦闘の開始時に付与されます（状態の「標準の付与先」が「相手」なら敵に付与）。';
  if(t==='combatEnd') return '「次の戦闘」の項目は、次の戦闘の開始時にだけ反映されます。永続の強化・最大HP・ゴールドなどは、発動のたびに加算されます。';
  return '永続の強化・最大HPなどは、発動のたびに加算されます（ターン開始時などに設定すると急速に大きくなります）。エネルギー・ドローの永続増加は、発動した戦闘中にもすぐ反映されます。';
}

function relicDescription(relic){
  const timing = relic.timing || 'onPickup';
  const e = relic.effect || {};
  const defs = relicFieldDefsFor(timing);
  const parts = [];
  defs.forEach(def=>{
    const v = e[def.key]||0;
    if(v>0) parts.push(def.desc(v));
  });
  const timingLabel = (RELIC_TIMINGS.find(t=>t.key===timing)||{}).label || timing;
  const main = parts.length ? parts.join('。')+'。' : '';
  // Favoured-tag bonus works for as long as the relic is owned, whatever its timing.
  const favor = (relic.favorTag && relic.favorPct>0) ? `[${relic.favorTag}]のカードの出現率+${relic.favorPct}%（所持中ずっと）。` : '';
  if(!main && !favor) return '効果なし';
  if(timing==='onPickup' || !main) return main + favor;
  const tagPart = timing==='onTagCardUsed' ? (relic.triggerTag ? `[${relic.triggerTag}]の` : 'どの') : '';
  return `【${timingLabel}】${tagPart}${main}${favor}`;
}

// Applies a relic's own timed effect once. Shares EFFECT_FIELD_DEFS with cards via
// applyEffectValues, plus the relic-only meta fields (max HP/gold/energy/draw) which
// only ever apply at onPickup (goldBonus also applies at combatEnd).
function fireRelicTiming(r, timing, playedCard){
  if(!r.player.relics || r.player.relics.length===0) return;
  r.player.relics.forEach(relicId=>{
    const relic = S.relics.find(x=>x.id===relicId);
    if(!relic || (relic.timing||'onPickup')!==timing) return;
    if(timing==='onTagCardUsed'){
      const tagOk = !relic.triggerTag || (playedCard && playedCard.tags && playedCard.tags.includes(relic.triggerTag));
      if(!tagOk) return;
    }
    const e = relic.effect || {};
    if(timing==='combatEnd'){ applyCombatEndRelic(r, relic, e); return; }
    applyRelicMeta(r, relic, e, 'battle');
    applyEffectValues(r, {name: relic.name, ...e});
  });
}

// Permanent, non-card gains shared by every timing. mode: 'pickup' (silent, outside combat),
// 'battle' (mid-combat: energy/draw also take effect immediately), 'end' (combat over).
function applyRelicMeta(r, relic, e, mode){
  const p = r.player;
  const L = str=>{ if(mode!=='pickup') pushLog(`${relic.name}: ${str}`); };
  if(e.maxHpBonus){ p.maxHp += e.maxHpBonus; p.hp = Math.min(p.maxHp, p.hp + e.maxHpBonus); L(`最大HP+${e.maxHpBonus}。`); }
  if(e.goldBonus){ p.gold += e.goldBonus; L(`ゴールド+${e.goldBonus}。`); }
  if(e.extraEnergy){
    p.extraEnergy = (p.extraEnergy||0) + e.extraEnergy;
    if(mode==='battle') p.energy += e.extraEnergy;
    L(`毎ターンのエネルギー+${e.extraEnergy}（永続）。`);
  }
  if(e.extraDraw){
    p.extraDraw = (p.extraDraw||0) + e.extraDraw;
    L(`毎ターンのドロー+${e.extraDraw}（永続）。`);
    if(mode==='battle') drawCards(e.extraDraw);
  }
  if(e.extraRewardChoices){ p.extraRewardChoices = (p.extraRewardChoices||0) + e.extraRewardChoices; L(`カード報酬の選択肢+${e.extraRewardChoices}。`); }
  if(e.rerollTokens){ p.rerollTokens = (p.rerollTokens||0) + e.rerollTokens; L(`リロールトークン+${e.rerollTokens}。`); }
}

function queueNextCombat(r, side, key, amt){
  const nc = r.nextCombat = r.nextCombat || {p:{}, e:{}, cp:{}, ce:{}};
  nc[side][key] = (nc[side][key]||0) + amt;
}
function applyCombatEndRelic(r, relic, e){
  const p = r.player;
  const L = str=> pushLog(`${relic.name}: ${str}`);
  applyRelicMeta(r, relic, e, 'end');
  ['permStrength','permDexterity','permMetallicize','permThorns'].forEach(k=>{
    if(e[k]>0){
      p[k] = (p[k]||0) + e[k];
      L(EFFECT_FIELD_DEFS.find(d=>d.key===k).desc(e[k])+'。');
    }
  });
  if(e.heal>0){ p.hp = Math.min(p.maxHp, p.hp + e.heal); L(`HPを${e.heal}回復。`); }
  if(e.loseHp>0){ p.hp = Math.max(1, p.hp - e.loseHp); L(`自分に${e.loseHp}ダメージ。`); }
  Object.keys(CE_STATUS_MAP).forEach(k=>{
    if(e[k]>0){
      const [side, field] = CE_STATUS_MAP[k];
      queueNextCombat(r, side, field, e[k]);
      const def = EFFECT_FIELD_DEFS.find(d=>d.key===k);
      L(`次の戦闘の開始時に${def.desc(e[k]).replace(/（この戦闘中のみ[^）]*）/,'')}。`);
    }
  });
  customStatusFieldDefs().forEach(def=>{
    const amt = e[def.key];
    if(!(amt>0)) return;
    const st = (S.customStatuses||[]).find(x=>x.id===def._statusId);
    if(!st) return;
    queueNextCombat(r, st.target==='opponent' ? 'ce' : 'cp', st.id, amt);
    L(`次の戦闘の開始時に${def.desc(amt)}。`);
  });
}

function applyRelicEffect(r, relic){
  r.player.relics.push(relic.id);
  if((relic.timing||'onPickup') !== 'onPickup') return; // recurring relics fire later, from fireRelicTiming
  const e = relic.effect || {};
  applyRelicMeta(r, relic, e, 'pickup');
  const eMain = {...e};
  customStatusFieldDefs().forEach(def=>{ delete eMain[def.key]; });   // 状態は、次の戦闘の開始時に付与する
  applyEffectValues(r, {name: relic.name, ...eMain});
  customStatusFieldDefs().forEach(def=>{
    const amt = e[def.key];
    if(!(amt>0)) return;
    const st = (S.customStatuses||[]).find(x=>x.id===def._statusId);
    if(st) queueNextCombat(r, st.target==='opponent' ? 'ce' : 'cp', st.id, amt);
  });
}

/* ============================= EVENTS (data-driven) ============================= */
// Events are stored as data (S.events) and edited from the home screen. Each event has a
// number of choice "slots" (1-3) and a pool of candidate choices; when the event shows up,
// the slots are filled from the pool. Every choice carries a list of effects that run in
// order, so good and bad effects can be bundled freely.

const EV_RARITY_OPTIONS = [
  {key:'any', label:'指定なし'}, {key:'basic', label:'ベーシック'}, {key:'common', label:'コモン'},
  {key:'uncommon', label:'アンコモン'}, {key:'rare', label:'レア'}, {key:'uncommon+', label:'アンコモン以上'},
  {key:'generated', label:'生成専用'}, {key:'enemy', label:'敵専用'},
];
function evSgn(a){ return (a>0?'+':'')+a; }
function evRarityOk(rarity, want, forGain){
  if(!want || want==='any') return forGain ? (rarity!=='basic' && rarity!=='generated' && rarity!=='enemy') : true;
  if(want==='uncommon+') return rarity==='uncommon' || rarity==='rare';
  return rarity===want;
}
function evRarityLabel(key){ return (EV_RARITY_OPTIONS.find(o=>o.key===key)||{}).label || ''; }

const EV_NUM = {

const EV_SPECIAL = {
  nextCustom:{label:'カスタム状態を付与'},
  gainCard:{label:'カードを入手'}, removeCard:{label:'カードを失う'},
  upgradeCard:{label:'カードを強化'}, duplicateCard:{label:'カードを複製'},

const EV_GROUPS = [
  ['HP・ゴールド', ['hp','maxHp','gold']],
  ['永続の能力', ['permStrength','permDexterity','permMetallicize','permThorns','extraEnergy','extraDraw','extraRewardChoices','rerollTokens']],
  ['次の戦闘のみ（自分）', ['nextStrength','nextDexterity','nextMetallicize','nextThorns','nextRegen','nextWeak','nextVulnerable','nextPoison']],
  ['次の戦闘のみ（敵）', ['nextEnemyStrength','nextEnemyWeak','nextEnemyVulnerable','nextEnemyPoison','nextEnemyStun']],

  ['デッキ', ['gainCard','removeCard','upgradeCard','duplicateCard']],
  ['レリック', ['gainRelic']],
];

const EV_DECK_OPS = ['removeCard','upgradeCard','duplicateCard'];

function evKindValid(k){ return !!(EV_NUM[k] || EV_SPECIAL[k]); }
function evKindLabel(k){ return (EV_NUM[k]||EV_SPECIAL[k]||{}).label || k; }
function evKindHeader(k){
  const g = EV_GROUPS.find(x=>x[1].includes(k));
  return (g ? g[0]+'：' : '') + evKindLabel(k);
}
function newEventEffect(kind){
  if(EV_NUM[kind]) return {kind, amount: (kind==='hp'||kind==='gold') ? 10 : 1};
  if(kind==='nextCustom') return {kind, statusId:((S.customStatuses||[])[0]||{}).id||'', amount:1};
  if(kind==='gainCard') return {kind, source:'random', cardId:'', rarity:'any', tag:'', count:1};
  if(kind==='gainRelic') return {kind, source:'random', relicId:'', rarity:'any'};
  return {kind, mode:'random', rarity:'any', tag:'', count:1};
}
function newEventChoice(label){
  return {label: label||'新しい選択肢', result:'', hideEffects:false, always:false, effects:[], outcomes:[]};
}

/* ---------- normalize (also used for import) ---------- */
function normalizeEventEffect(x){
  if(!x || typeof x!=='object' || !evKindValid(x.kind)) return null;
  const k = x.kind;
  const str = v=> typeof v==='string' ? v.trim() : '';
  const rar = v=> EV_RARITY_OPTIONS.some(o=>o.key===v) ? v : 'any';
  if(EV_NUM[k]){ const s = !!EV_NUM[k].signed; return {kind:k, amount: clampInt(x.amount, s?-999:0, 999, s?0:1)}; }
  if(k==='nextCustom') return {kind:k, statusId:str(x.statusId), amount:clampInt(x.amount,0,999,1)};
  if(k==='gainCard') return {kind:k, source:x.source==='specific'?'specific':'random', cardId:str(x.cardId), rarity:rar(x.rarity), tag:cleanTag(x.tag), count:clampInt(x.count,1,20,1)};
  if(k==='gainRelic') return {kind:k, source:x.source==='specific'?'specific':'random', relicId:str(x.relicId), rarity:rar(x.rarity)};
  return {kind:k, mode:x.mode==='choose'?'choose':'random', rarity:rar(x.rarity), tag:cleanTag(x.tag), count:clampInt(x.count,1,20,1)};
}
function normalizeEvent(ev){
  const e = {...ev};
  e.title = (typeof ev.title==='string' && ev.title.trim()) ? ev.title.trim() : '無題のイベント';
  e.desc = typeof ev.desc==='string' ? ev.desc : '';
  e.image = cleanImage(ev.image);
  e.slots = clampInt(ev.slots,1,3,2);
  e.weight = clampInt(ev.weight,1,20,1);
  e.choices = (Array.isArray(ev.choices) ? ev.choices : []).filter(c=>c && typeof c==='object').map(c=>({
    label: (typeof c.label==='string' && c.label.trim()) ? c.label.trim() : '先へ進む',
    result: typeof c.result==='string' ? c.result : '',
    hideEffects: !!c.hideEffects,
    always: !!c.always,
    effects: (Array.isArray(c.effects) ? c.effects : []).map(normalizeEventEffect).filter(Boolean),
    // 確率で分岐する結果。chance は重み（合計に対する割合で確率が決まる）
    outcomes: (Array.isArray(c.outcomes) ? c.outcomes : []).filter(o=>o && typeof o==='object').map(o=>({
      chance: clampInt(o.chance,1,1000,1),
      result: typeof o.result==='string' ? o.result : '',
      effects: (Array.isArray(o.effects) ? o.effects : []).map(normalizeEventEffect).filter(Boolean),
    })),
  }));
  if(e.choices.length===0) e.choices = [newEventChoice('先へ進む')];
  return e;
}

/* ---------- text describing an effect ---------- */
function evFilterText(eff, forGain){
  const parts = [];
  if(eff.rarity && eff.rarity!=='any') parts.push(evRarityLabel(eff.rarity));
  if(eff.tag) parts.push(`[${eff.tag}]`);
  return parts.join('');
}
function eventEffectText(eff){
  const k = eff.kind;
  if(EV_NUM[k]) return EV_NUM[k].text(eff.amount|0);
  const cnt = (eff.count|0) || 1;
  const f = evFilterText(eff);
  const how = eff.mode==='choose' ? '選択' : 'ランダム';
  if(k==='nextCustom'){
    const st = (S.customStatuses||[]).find(x=>x.id===eff.statusId);
    if(!st) return '（存在しないカスタム状態）';
    return `${st.emoji||''}${st.name}${eff.amount|0}（次の戦闘のみ・${st.target==='opponent'?'敵に':'自分に'}）`;
  }
  if(k==='gainCard'){
    if(eff.source==='specific'){
      const c = S.cards.find(x=>x.id===eff.cardId);
      return `カード「${c?c.name:'？'}」を${cnt}枚入手`;
    }
    return `${f?f+'の':''}ランダムなカードを${cnt}枚入手`;
  }
  if(k==='removeCard') return `${f?f+'の':''}カードを${cnt}枚失う（${how}）`;
  if(k==='upgradeCard') return `${f?f+'の':''}カードを${cnt}枚強化（${how}）`;
  if(k==='duplicateCard') return `${f?f+'の':''}カードを${cnt}枚複製（${how}）`;
  if(k==='gainRelic'){
    if(eff.source==='specific'){
      const rel = S.relics.find(x=>x.id===eff.relicId);
      return `レリック「${rel?rel.name:'？'}」を入手`;
    }
    return `${eff.rarity&&eff.rarity!=='any' ? evRarityLabel(eff.rarity)+'の' : ''}ランダムなレリックを入手`;
  }
  return '';
}
function eventOutcomesText(ch){
  const outs = ch.outcomes||[];
  if(!outs.length) return '';
  const total = outs.reduce((sum,o)=> sum + Math.max(1,o.chance|0), 0);
  return '確率 ' + outs.map(o=>{
    const pct = Math.round(Math.max(1,o.chance|0)/total*100);
    const fx = (o.effects||[]).map(eventEffectText).join('・');
    return `${pct}%：${fx||'何も起こらない'}`;
  }).join(' ／ ');
}
function eventChoiceGoldNeed(ch){
  return (ch.effects||[]).reduce((s,e)=> (e.kind==='gold' && (e.amount|0)<0) ? s-(e.amount|0) : s, 0);
}

/* ---------- running an event ---------- */
function pickEventForRun(){
  const valid = (S.events||[]).filter(ev=>ev && Array.isArray(ev.choices) && ev.choices.length);
  const pool = valid.length ? valid : DEFAULT_EVENTS;
  const total = pool.reduce((s,ev)=> s + (ev.weight||1), 0);
  let x = Math.random()*total, ev = pool[pool.length-1];
  for(const cand of pool){ x -= (cand.weight||1); if(x<=0){ ev = cand; break; } }
  const slots = clampInt(ev.slots,1,3,2);
  const idxs = ev.choices.map((c,i)=>i);
  const always = idxs.filter(i=>ev.choices[i].always).slice(0,slots);
  const rest = shuffle(idxs.filter(i=>!always.includes(i)));
  const picked = always.concat(rest.slice(0, slots-always.length)).sort((a,b)=>a-b);
  return {
    id: ev.id, title: ev.title, desc: ev.desc||'', image: ev.image||'',
    choices: picked.map(i=> JSON.parse(JSON.stringify(ev.choices[i]))),
  };
}

function eventDeckCandidates(r, eff){
  return ownedCardInstances(r).filter(x=>{
    const {iid} = splitInstanceId(x.cid);
    if(iid && r.temporaryCardIids && r.temporaryCardIids[iid]) return false;
    const c = cardById(x.cid);
    if(!c) return false;
    if(!evRarityOk(c.rarity, eff.rarity, false)) return false;
    if(eff.tag && !(c.tags && c.tags.includes(eff.tag))) return false;
    if(eff.kind==='upgradeCard' && isUpgradedInstanceId(x.cid)) return false;
    return true;
  });
}
function eventDeckOpApply(r, eff, chosen){
  const L = s=> r.eventLog.push(s);
  if(!chosen.length){ L('対象となるカードがなかった。'); return; }
  const names = chosen.map(x=> cardById(x.cid).name);
  if(eff.kind==='removeCard'){
    const byPile = {};
    chosen.forEach(x=>{ (byPile[x.pile] = byPile[x.pile] || []).push(x.i); });
    Object.keys(byPile).forEach(p=> byPile[p].sort((a,b)=>b-a).forEach(i=> r[p].splice(i,1)));
    L(`失ったカード: ${names.join('、')}`);
  } else if(eff.kind==='upgradeCard'){
    chosen.forEach(x=>{ r[x.pile][x.i] = upgradeRawId(x.cid); });
    L(`強化: ${names.map(n=>`${n}→${n}+`).join('、')}`);
  } else if(eff.kind==='duplicateCard'){
    chosen.forEach(x=>{ r.discard.push(splitInstanceId(x.cid).cid); });
    L(`複製: ${names.join('、')}`);
  }
}

function applyEventEffect(r, eff){
  const p = r.player, k = eff.kind, a = eff.amount|0;
  const L = s=> r.eventLog.push(s);
  if(k==='hp'){
    const before = p.hp;
    p.hp = a>=0 ? Math.min(p.maxHp, p.hp + a) : Math.max(1, p.hp + a);
    const d = p.hp - before;
    L(d===0 ? (a<0 ? 'HPは1未満にならないため、変化しなかった。' : 'HPは既に最大だった。') : `HP${evSgn(d)}`);
  } else if(k==='maxHp'){
    p.maxHp = Math.max(1, p.maxHp + a);
    if(a>0) p.hp = Math.min(p.maxHp, p.hp + a); else p.hp = Math.min(p.hp, p.maxHp);
    L(`最大HP${evSgn(a)}`);
  } else if(k==='gold'){
    const before = p.gold;
    p.gold = Math.max(0, p.gold + a);
    L(`ゴールド${evSgn(p.gold - before)}`);
  } else if(['permStrength','permDexterity','permMetallicize','permThorns','extraRewardChoices','rerollTokens'].includes(k)){
    p[k] = (p[k]||0) + a;
    L(eventEffectText(eff));
  } else if(k==='extraEnergy'){
    p.extraEnergy = Math.max(1 - S.settings.energyPerTurn, (p.extraEnergy||0) + a);
    L(eventEffectText(eff));
  } else if(k==='extraDraw'){
    p.extraDraw = Math.max(1 - S.settings.handSize, (p.extraDraw||0) + a);
    L(eventEffectText(eff));
  } else if(EV_NEXT_PLAYER[k] || EV_NEXT_ENEMY[k] || k==='nextCustom'){
    if(a<=0) return;
    const nc = r.nextCombat = r.nextCombat || {p:{}, e:{}, cp:{}, ce:{}};
    if(EV_NEXT_PLAYER[k]){ const f = EV_NEXT_PLAYER[k]; nc.p[f] = (nc.p[f]||0) + a; }
    else if(EV_NEXT_ENEMY[k]){ const f = EV_NEXT_ENEMY[k]; nc.e[f] = (nc.e[f]||0) + a; }
    else {
      const st = (S.customStatuses||[]).find(x=>x.id===eff.statusId);
      if(!st) return;
      const bag = st.target==='opponent' ? nc.ce : nc.cp;
      bag[st.id] = (bag[st.id]||0) + a;
    }
    L(eventEffectText(eff));
  } else if(k==='gainCard'){
    const cnt = (eff.count|0) || 1;
    let pool;
    if(eff.source==='specific'){ const c = S.cards.find(x=>x.id===eff.cardId); pool = c ? [c] : []; }
    else pool = S.cards.filter(c=> evRarityOk(c.rarity, eff.rarity, true) && (!eff.tag || (c.tags||[]).includes(eff.tag)));
    if(!pool.length){ L('入手できるカードが見当たらなかった。'); return; }
    const got = [];
    for(let i=0;i<cnt;i++){ const c = pool[Math.floor(Math.random()*pool.length)]; r.discard.push(c.id); noteCardAcquired(r, c.id); got.push(c.name); }
    L(`入手したカード: ${got.join('、')}`);
  } else if(k==='gainRelic'){
    let relic = null;
    const owned = p.relics || [];
    if(eff.source==='specific'){
      relic = S.relics.find(x=>x.id===eff.relicId) || null;
      if(relic && owned.includes(relic.id)) relic = null;
    } else {
      const pool = S.relics.filter(x=> !owned.includes(x.id) && !isNonRewardRelic(x) && evRarityOk(x.rarity, eff.rarity, false));
      relic = pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
    }
    if(!relic){ L('入手できるレリックがなかった。'); return; }
    applyRelicEffect(r, relic);
    L(`レリック入手: ${relic.name}（${relicDescription(relic)}）`);
  }
}

// Effects run one after another. A deck operation set to "choose" pauses the queue and
// shows a card picker; everything else resolves immediately.
function processEventQueue(){
  const r = S.run;
  while(r.eventQueue.length){
    const eff = r.eventQueue.shift();
    if(EV_DECK_OPS.includes(eff.kind)){
      const cands = eventDeckCandidates(r, eff);
      const cnt = Math.min((eff.count|0)||1, cands.length);
      if(cands.length===0){ r.eventLog.push('対象となるカードがなかった。'); continue; }
      if(eff.mode==='choose' && cands.length>cnt){
        r.eventPick = {eff, need:cnt, cands, selected:[]};
        renderEventPick();
        return;
      }
      eventDeckOpApply(r, eff, eff.mode==='choose' ? cands : shuffle(cands).slice(0,cnt));
      continue;
    }
    applyEventEffect(r, eff);
  }
  r.eventResult = {text: [(r.eventChoice && r.eventChoice.result) || '', r.eventOutcomeText || ''].filter(Boolean).join('\n\n'), lines: r.eventLog.slice()};
  r.eventOutcomeText = '';
  r.eventPick = null;
  renderEvent();
}

function applyNextCombatEffects(r){
  const nc = r.nextCombat;
  if(!nc) return;
  r.nextCombat = null;
  const p = r.player, e = r.enemy;
  Object.keys(nc.p||{}).forEach(f=>{ if(BUILTIN_FIELD_TAG[f]) grantBuiltin(p, f, nc.p[f]); else p[f] = (p[f]||0) + nc.p[f]; });
  Object.keys(nc.e||{}).forEach(f=>{ if(BUILTIN_FIELD_TAG[f]) grantBuiltin(e, f, nc.e[f]); else e[f] = (e[f]||0) + nc.e[f]; });
  Object.keys(nc.cp||{}).forEach(id=> grantCustomStatus(p, id, nc.cp[id]));
  Object.keys(nc.ce||{}).forEach(id=> grantCustomStatus(e, id, nc.ce[id]));
  pushLog('イベントの効果がこの戦闘に反映された。');
}

function renderEventPick(){
  const r = S.run, pk = r.eventPick, eff = pk.eff;
  const verb = {removeCard:'失う', upgradeCard:'強化する', duplicateCard:'複製する'}[eff.kind] || '選ぶ';
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">EVENT</p>

    <p style="color:var(--parchment-dim); margin:10px 0;">${verb}カードを${pk.need}枚選んでください（${pk.selected.length} / ${pk.need}）</p>
    <div class="reward-row" id="ev-pick-row">
      ${pk.cands.map((x,i)=>{
        const c = cardById(x.cid);
        const on = pk.selected.includes(i);
        return `<div data-idx="${i}" style="cursor:pointer; ${on?'outline:3px solid var(--gold); border-radius:10px;':''}">${renderCardHTML(c,{mini:true})}</div>`;
      }).join('')}
    </div>
    <button class="primary" id="btn-ev-pick" ${pk.selected.length!==pk.need?'disabled':''}>決定</button>
  </div>`;
  qsa('#ev-pick-row > div').forEach(wrap=>{
    wrap.onclick = ()=>{
      const i = parseInt(wrap.dataset.idx,10);
      const pos = pk.selected.indexOf(i);
      if(pos>=0) pk.selected.splice(pos,1);
      else if(pk.selected.length < pk.need) pk.selected.push(i);
      renderEventPick();
    };
  });
  qs('#btn-ev-pick').onclick = ()=>{
    if(pk.selected.length!==pk.need) return;
    eventDeckOpApply(r, eff, pk.selected.map(i=>pk.cands[i]));
    r.eventPick = null;
    processEventQueue();
  };
}

function renderEvent(){
  const r = S.run, p = r.player;
  if(!r.currentEvent){
    r.currentEvent = pickEventForRun();
    r.eventResult = null; r.eventLog = []; r.eventQueue = []; r.eventPick = null; r.eventChoice = null;
  }
  if(r.eventPick){ renderEventPick(); return; }
  const ev = r.currentEvent;
  const res = r.eventResult;
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">EVENT</p>
    <h2>${escapeHtml(ev.title)}</h2>
    ${ev.image ? `<img class="ev-image" src="${ev.image}" alt="">` : ''}
    <p style="color:var(--parchment-dim); max-width:440px; margin:10px auto; white-space:pre-wrap;">${escapeHtml(ev.desc)}</p>
    <p style="font-size:13px; color:var(--gold);">HP ${p.hp} / ${p.maxHp} ・ 所持ゴールド: ${p.gold}</p>
    ${res ? `
      ${res.text ? `<p style="margin-top:20px; color:var(--parchment); white-space:pre-wrap;">${escapeHtml(res.text)}</p>` : ''}
      ${res.lines.length ? `<div class="ev-result-lines">${res.lines.map(l=>`<div>${escapeHtml(l)}</div>`).join('')}</div>` : ''}
      ${(!res.text && !res.lines.length) ? `<p style="margin-top:20px; color:var(--parchment);">何も起こらなかった。</p>` : ''}
      <div style="margin-top:22px;"><button class="primary" id="btn-event-continue">先へ進む</button></div>
    ` : `
      <div style="display:flex; flex-direction:column; gap:10px; max-width:420px; margin:24px auto 0;">
        ${ev.choices.map((c,i)=>{
          const need = eventChoiceGoldNeed(c);
          const short = need > p.gold;
          const fx = c.hideEffects ? '' : [(c.effects||[]).map(eventEffectText).join(' ／ '), eventOutcomesText(c)].filter(Boolean).join(' ／ ');
          return `<button class="ghost event-choice" data-idx="${i}" ${short?'disabled':''}>
            <span>${escapeHtml(c.label)}</span>
            ${fx || short ? `<span class="ev-fx">${escapeHtml(fx)}${short?`${fx?' ':''}（ゴールドが足りない）`:''}</span>` : ''}
          </button>`;
        }).join('')}
      </div>
    `}
  </div>`;
  if(!res){
    qsa('.event-choice').forEach(btn=>{
      btn.onclick = ()=>{
        const choice = ev.choices[parseInt(btn.dataset.idx,10)];
        r.eventChoice = choice;
        r.eventLog = [];
        r.eventQueue = (choice.effects||[]).map(x=>({...x}));
        r.eventOutcomeText = '';
        const outs = choice.outcomes||[];
        if(outs.length){
          let x = Math.random()*outs.reduce((sum,o)=> sum + Math.max(1,o.chance|0), 0);
          let hit = outs[outs.length-1];
          for(const o of outs){ x -= Math.max(1,o.chance|0); if(x<=0){ hit = o; break; } }
          r.eventOutcomeText = hit.result||'';
          r.eventQueue = r.eventQueue.concat((hit.effects||[]).map(x=>({...x})));
        }
        processEventQueue();
      };
    });
  } else {
    qs('#btn-event-continue').onclick = ()=>{
      r.currentEvent = null; r.eventResult = null; r.eventChoice = null; r.eventLog = []; r.eventQueue = [];
      r.floor++; beginFloor();
    };
  }
}

function evEffectFieldsHTML(eff, ci, ei, oi){

  if(k==='gainCard'){

        ? `<div><label>レリック</label><select ${at} data-f="relicId">${rels.map(x=>`<option value="${escapeHtml(x.id)}" ${x.id===eff.relicId?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div>`
        : rarSel(EV_RARITY_OPTIONS.filter(o=>o.key!=='basic'))}</div>`;
  }
  // deck operations: remove / upgrade / duplicate
  return `<div class="ev-eff-grid">
    <div><label>対象の決め方</label><select ${at} data-f="mode">
      <option value="random" ${eff.mode!=='choose'?'selected':''}>ランダム</option>

  </div>`;
  const root = qs('.ev-form');
  bindImageField(root, 'ev', 640, ()=>d.image||'', v=>{ d.image = v; });
  root.addEventListener('input', e=> evFormSync(e.target));
  root.addEventListener('change', e=>{
    evFormSync(e.target);
    if(e.target.dataset && e.target.dataset.rerender) renderEventForm();
  });
  root.addEventListener('click', e=>{
    const b = e.target.closest('[data-act]');
