// A custom status is a user-defined buff/debuff. Its stack count lives on whichever
// entity (r.player or r.enemy) holds it, in that entity's `customStatus` map, keyed
// by the status's own id: entity.customStatus = { [statusId]: stackCount }.
//
// "kind" decides the one mechanical thing the status does; this mirrors the built-in
// statuses (weak/vulnerable/strength/dexterity/metallicize/poison/regen/thorns/stun),
// generalized so any of them can be re-created with custom numbers, name and emoji:
const CUSTOM_STATUS_KINDS = [
  {key:'damageDealtPct', label:'与ダメージを％変化させる（弱体のように、マイナス値で軽減）'},
  {key:'damageTakenPct', label:'被ダメージを％変化させる（脆弱のように、プラス値で増加）'},
  {key:'damageTakenFlat', label:'被ダメージに固定値を加算する（マイナス値で軽減。ダメージが0の攻撃には加算されない）'},
  {key:'damageDealtFlat', label:'与ダメージに固定値を加算する（強化のように）'},
  {key:'blockGainFlat', label:'ブロック獲得量に固定値を加算する（器用のように）'},
  {key:'autoBlock', label:'自分のターン開始時にブロックを獲得する（自動ブロックのように）'},
  {key:'turnStartDamage', label:'自分のターン開始時にダメージを受ける（毒のように）'},
  {key:'turnStartHeal', label:'自分のターン開始時にHPを回復する（再生のように）'},
  {key:'reflectDamage', label:'攻撃を受けた時に反射ダメージを与える（棘のように）'},
  {key:'skipTurn', label:'自分のターンを1回休む（麻痺のように、数値は無視）'},
  {key:'revive', label:'HPが0になったとき復活する（発動のたびにスタックを1消費。効果量が復活時のHP）'},
];

// 状態のタグ。組み込みの状態には、次の名前のタグが付いているものとして扱う。
// カスタム状態には、状態の編集画面で自由にタグを付けられる。
const BUILTIN_STATUS_TAGS = {
  '強化': e=>(e.strength||0)+(e.permStrength||0),
  '器用': e=>(e.dexterity||0)+(e.permDexterity||0),
  '弱体': e=>e.weak||0, '脆弱': e=>e.vulnerable||0, '毒': e=>e.poison||0,
  '再生': e=>e.regen||0, '麻痺': e=>e.stun||0,
  '自動ブロック': e=>(e.metallicize||0)+(e.permMetallicize||0),
  '棘': e=>(e.thorns||0)+(e.permThorns||0),
};
function tagStacks(entity, tag){
  if(!entity || !tag) return 0;
  let sum = BUILTIN_STATUS_TAGS[tag] ? BUILTIN_STATUS_TAGS[tag](entity) : 0;
  (S.customStatuses||[]).forEach(st=>{ if((st.tags||[]).includes(tag)) sum += customStatusStacks(entity, st.id); });
  return sum;
}
// 組み込みの状態のうち「取り除く／減らす」の対象になる欄（永続の値は対象外）
const BUILTIN_TAG_FIELDS = {
  '強化':['strength'], '器用':['dexterity'], '弱体':['weak'], '脆弱':['vulnerable'], '毒':['poison'],
  '再生':['regen'], '麻痺':['stun'], '自動ブロック':['metallicize'], '棘':['thorns'],
};
// amount===null なら全部取り除く。そうでなければ、該当する状態それぞれからamountずつ減らす。減らせた合計を返す。
function reduceTagStatuses(entity, tag, amount){
  if(!entity || !tag) return 0;
  let total = 0;
  const cut = cur=> amount===null ? cur : Math.min(cur, Math.max(0, amount));
  (BUILTIN_TAG_FIELDS[tag]||[]).forEach(f=>{
    const cur = entity[f]||0;
    if(cur>0){ const d = cut(cur); entity[f] = cur - d; total += d; }
  });
  (S.customStatuses||[]).forEach(st=>{
    if(!(st.tags||[]).includes(tag)) return;
    const cur = customStatusStacks(entity, st.id);
    if(cur>0){ const d = cut(cur); addCustomStatusStacks(entity, st.id, -d); total += d; }
  });
  return total;
}
function normalizeCardStatusOp(o){
  if(!o || typeof o!=='object' || !o.enabled) return {enabled:false};
  return {enabled:true, side:['self','opponent','both'].includes(o.side)?o.side:'self', tag:cleanTag(o.tag),
    mode:o.mode==='reduce'?'reduce':'removeAll', amount:clampInt(o.amount,0,99,1), first:!!o.first};
}
function statusOpText(op){
  if(!op || !op.enabled || !op.tag) return '';
  const who = op.side==='opponent' ? '相手' : (op.side==='both' ? '自分と相手' : '自分');
  const base = op.mode==='reduce' ? `${who}の[${op.tag}]の状態を${op.amount}減らす` : `${who}の[${op.tag}]の状態をすべて取り除く`;
  return op.first ? base+'（付与より先）' : base;
}
// selfE＝このカードを使った側、foeE＝その相手
function applyStatusOp(op, selfE, foeE, name){
  if(!op || !op.enabled || !op.tag) return;
  const amt = op.mode==='reduce' ? Math.max(0, op.amount|0) : null;
  const targets = op.side==='both' ? [selfE, foeE] : (op.side==='opponent' ? [foeE] : [selfE]);
  let total = 0;
  targets.forEach(t=>{ total += reduceTagStatuses(t, op.tag, amt); });
  if(total>0) pushLog(`${name}: ${statusOpText(op)}（計${total}）。`);
}
function customStatusStacks(entity, statusId){
  return (entity.customStatus && entity.customStatus[statusId]) || 0;
}
function setCustomStatusStacks(entity, statusId, val){
  if(!entity.customStatus) entity.customStatus = {};
  if(val<=0) delete entity.customStatus[statusId];
  else entity.customStatus[statusId] = val;
}
function addCustomStatusStacks(entity, statusId, delta){
  setCustomStatusStacks(entity, statusId, customStatusStacks(entity, statusId) + delta);
}
// ===== 排他（付与のときだけ判定。ターンごとの増減・消費では働かない。自分自身は数えない） =====
function exclWho(entity){ return (S.run && entity===S.run.player) ? 'あなた' : ((entity && entity.name) || ''); }
// 自分（selfId）以外で、そのタグを持つ状態の合計（組み込みの同名タグを含む）
function otherTagStacks(entity, tag, selfId){
  if(!entity || !tag) return 0;
  let sum = BUILTIN_STATUS_TAGS[tag] ? BUILTIN_STATUS_TAGS[tag](entity) : 0;
  (S.customStatuses||[]).forEach(x=>{ if(x.id!==selfId && (x.tags||[]).includes(tag)) sum += customStatusStacks(entity, x.id); });
  return sum;
}
// 自分以外の、そのタグの状態をすべて取り除く（永続の強化・器用などは対象外）。取り除いた合計を返す
function removeOtherTagStatuses(entity, tag, selfId){
  let total = 0;
  (BUILTIN_TAG_FIELDS[tag]||[]).forEach(f=>{ const cur = entity[f]||0; if(cur>0){ entity[f] = 0; total += cur; } });
  (S.customStatuses||[]).forEach(x=>{
    if(x.id===selfId || !(x.tags||[]).includes(tag)) return;
    const cur = customStatusStacks(entity, x.id);
    if(cur>0){ setCustomStatusStacks(entity, x.id, 0); total += cur; }
  });
  return total;
}
function exclLog(msg){ try{ pushLog(msg); }catch(e){} }
// 組み込みの状態（欄名）が持つ同名タグ
const BUILTIN_FIELD_TAG = {strength:'強化', permStrength:'強化', dexterity:'器用', permDexterity:'器用', weak:'弱体', vulnerable:'脆弱',
  poison:'毒', regen:'再生', stun:'麻痺', metallicize:'自動ブロック', permMetallicize:'自動ブロック', thorns:'棘', permThorns:'棘'};
// g＝いま付与されようとしている状態 {id（カスタム状態のid。組み込みはnull）, name, tags}
// ④ すでにいる別の状態が「付与を無効にする」設定で、g のタグに当たるなら、付与を止める
function exclGuardBlocks(entity, g){
  const guard = (S.customStatuses||[]).find(h=> h.id!==g.id && customStatusStacks(entity, h.id)>0 && (h.exclGuard||[]).some(t=>g.tags.includes(t)));
  if(!guard) return false;
  exclLog(`${exclWho(entity)}は${guard.emoji||''}${guard.name}があるため、${g.name}は付与されなかった。`);
  return true;
}
// ③ すでにいる別の状態が「後から付与されると消える」設定で、g のタグに当たるなら、その状態を消す
function exclRemoveReplaced(entity, g){
  (S.customStatuses||[]).forEach(h=>{
    if(h.id===g.id || !(customStatusStacks(entity, h.id)>0)) return;
    if(!(h.exclReplaced||[]).some(t=>g.tags.includes(t))) return;
    setCustomStatusStacks(entity, h.id, 0);
    exclLog(`${g.name}が付与されたため、${exclWho(entity)}の${h.emoji||''}${h.name}が消えた。`);
  });
}
// 組み込みの状態を「付与」する（ある欄にvを足す）。付与されなければ0を返す
function grantBuiltin(entity, field, v){
  if(!(v>0)) return 0;
  const tag = BUILTIN_FIELD_TAG[field];
  const g = {id:null, name:tag||field, tags: tag ? [tag] : []};
  if(tag && exclGuardBlocks(entity, g)) return 0;
  entity[field] = (entity[field]||0) + v;
  if(tag) exclRemoveReplaced(entity, g);
  return v;
}
// カスタム状態を「付与」する。排他の設定に従い、付与されなければ0を返す（スタックを減らす操作はそのまま通す）
// 判定の順: ④（守る）→ ②（先着に負ける）→ ①（上書きする）→ 付与 → ③（後から上書きされる）
function grantCustomStatus(entity, statusId, delta){
  if(!(delta>0)){ addCustomStatusStacks(entity, statusId, delta); return delta; }
  const st = (S.customStatuses||[]).find(x=>x.id===statusId);
  const nm = st ? `${st.emoji||''}${st.name}` : '';
  const g = {id:statusId, name:nm, tags:(st&&st.tags)||[]};
  if(st){
    if(exclGuardBlocks(entity, g)) return 0;
    const yTag = (st.exclYield||[]).find(t=> otherTagStacks(entity, t, statusId)>0);
    if(yTag){ exclLog(`${exclWho(entity)}は[${yTag}]の状態を持っているため、${nm}は付与されなかった。`); return 0; }
    (st.exclOverwrite||[]).forEach(t=>{
      const n = removeOtherTagStatuses(entity, t, statusId);
      if(n>0) exclLog(`${nm}の付与で、${exclWho(entity)}の[${t}]の状態が取り除かれた。`);
    });
  }
  addCustomStatusStacks(entity, statusId, delta);
  if(st) exclRemoveReplaced(entity, g);
  return delta;
}
// 'fixed': the configured value applies as-is, regardless of stack count (stacks just
// count down as a duration, like weak/vulnerable). 'perStack': the configured value is
// a per-stack coefficient, so the total scales with the current stack count (like poison).
const DECIMAL_MAG_KINDS = ['damageDealtFlat','damageTakenFlat'];
function customStatusMagnitude(status, stacks){
  const v = status.magnitudeMode==='perStack' ? status.magnitudeValue*stacks : status.magnitudeValue;
  // ダメージ固定値加算は、係数に小数を使える。計算結果は切り捨て（浮動小数の誤差を丸めてから）
  return DECIMAL_MAG_KINDS.includes(status.kind) ? Math.floor(Math.round(v*1e6)/1e6) : v;
}
// Every effect of the given kind, across all custom statuses the entity currently holds.
function customEffectsOn(entity, kind){
  const out = [];
  (S.customStatuses||[]).forEach(st=>{
    const stacks = customStatusStacks(entity, st.id);
    if(stacks<=0) return;
    (st.effects||[]).forEach(eff=>{ if(eff.kind===kind) out.push({st, eff, stacks}); });
  });
  return out;
}
function customEffectSum(entity, kind){
  return customEffectsOn(entity, kind).reduce((sum,x)=> sum + customStatusMagnitude(x.eff, x.stacks), 0);
}
function customDamageDealtBonus(entity){
  return {flat: customEffectSum(entity,'damageDealtFlat'), pct: customEffectSum(entity,'damageDealtPct')};
}
function customDamageTakenPct(entity){ return customEffectSum(entity,'damageTakenPct'); }
function customDamageTakenFlat(entity){ return customEffectSum(entity,'damageTakenFlat'); }
function customBlockGainBonus(entity){ return customEffectSum(entity,'blockGainFlat'); }
function customReflectDamage(entity){ return customEffectSum(entity,'reflectDamage'); }

// HPが0になったとき、「復活」効果を持つ状態があれば、スタックを1消費してHPを回復する。
// 復活したらtrue。HPが0のままならfalse（＝本当に倒れた）。
function reviveIfAble(entity, name){
  if(entity.hp>0) return false;
  for(const st of (S.customStatuses||[])){
    const stacks = customStatusStacks(entity, st.id);
    if(stacks<=0) continue;
    const eff = (st.effects||[]).find(x=>x.kind==='revive');
    if(!eff) continue;
    const mag = customStatusMagnitude(eff, stacks);
    const hp = eff.reviveUnit==='percent' ? Math.ceil(entity.maxHp*mag/100) : mag;
    entity.hp = Math.max(1, Math.min(entity.maxHp, Math.round(hp)));
    addCustomStatusStacks(entity, st.id, -1);
    pushLog(`${st.emoji||''}${st.name}の効果で${name||'倒れかけた者'}が復活した！（HP${entity.hp}）`);
    (eff.reviveGrants||[]).forEach(g=>{
      const gs = (S.customStatuses||[]).find(x=>x.id===g.statusId);
      if(!gs || !(g.stacks>0)) return;
      if(grantCustomStatus(entity, gs.id, g.stacks)===0) return;   // 排他で付与されなかった
      pushLog(`${name||'倒れかけた者'}は${gs.emoji||''}${gs.name}+${g.stacks}を得た。`);
    });
    return true;
  }
  return false;
}
function playerFallen(){ return S.run.player.hp<=0 && !reviveIfAble(S.run.player, 'あなた'); }
function enemyFallen(){ return S.run.enemy.hp<=0 && !reviveIfAble(S.run.enemy, S.run.enemy.name); }

// Runs at the start of `entity`'s own turn: autoBlock / turnStartDamage / turnStartHeal /
// skipTurn fire, then every custom status currently on the entity applies its perTurnDelta
// (grows or shrinks its own stack count — this is the "ターンごとに増減" option). Returns
// true if the entity's turn should be skipped entirely.
function tickCustomStatusesForTurn(entity){
  let skip = false;
  (S.customStatuses||[]).forEach(st=>{
    const stacks = customStatusStacks(entity, st.id);
    if(stacks<=0) return;
    const tag = `${st.emoji||''}${st.name}`;
    let skipped = false;
    (st.effects||[]).forEach(eff=>{
      const mag = customStatusMagnitude(eff, stacks);
      if(eff.kind==='turnStartDamage'){
        const amt = Math.max(0, mag);
        if(amt>0){ entity.hp = Math.max(0, entity.hp - amt); pushLog(`${tag}によって${amt}ダメージ。`); }
      } else if(eff.kind==='turnStartHeal'){
        const amt = Math.max(0, mag);
        if(amt>0){ entity.hp = Math.min(entity.maxHp, entity.hp + amt); pushLog(`${tag}によってHPを${amt}回復した。`); }
      } else if(eff.kind==='autoBlock'){
        const amt = Math.max(0, mag);
        if(amt>0) entity.block += amt;
      } else if(eff.kind==='skipTurn'){
        if(!skipped){
          skipped = true; skip = true;
          addCustomStatusStacks(entity, st.id, -1);
          pushLog(`${tag}によって行動できない。`);
        }
      } else if(eff.kind==='cardOp' && eff.op){
        // A card-operation acts on the PLAYER's deck, so it only fires while the player is
        // the one holding the status (whoever applied it — a card, a relic, or an enemy
        // move). It is queued and resolved after this turn's hand has been drawn (see
        // runTurnStartCardOps). How many times it fires uses this effect's magnitude.
        const times = Math.max(0, Math.round(mag));
        if(entity===S.run.player){
          for(let i=0;i<times;i++) queueTurnStartOp(S.run, {...eff.op, enabled:true}, `${tag}の効果`);
        } else {
          // 敵が持っている場合: 敵のターン開始時に予約し、プレイヤーの次のターン開始時（手札を引いた後）に
          // プレイヤーのデッキへ作用する（敵のカード操作技と同じ扱い）。
          const rr = S.run;
          for(let i=0;i<times;i++){
            const op = {...eff.op, enabled:true, fromEnemy:true};
            queueTurnStartOp(rr, op, `${entity.name}の${tag}`);
            const t = enemyOpText(op);
            rr.pendingTurnStartOps[rr.pendingTurnStartOps.length-1].label = `${entity.name}の${tag}の効果${t?'：'+t:''}`;
          }
        }
      }
    });
  });
  (S.customStatuses||[]).forEach(st=>{
    const stacks = customStatusStacks(entity, st.id);
    if(stacks>0 && st.perTurnDelta) addCustomStatusStacks(entity, st.id, st.perTurnDelta);
  });
  return skip;
}

// ---- Card operations that resolve at the start of the player's turn, after the draw ----
// Sources: statuses the player or the enemy holds, and enemy moves that carry a card-operation.
// An operation used by the ENEMY has its point of view flipped (see resolveEnemyCardOp):
// "add to the enemy's deck" goes into the PLAYER's draw pile, every other operation acts on
// the enemy's own deck.
function opChooseVerb(op){
  return ({moveToDiscard:'捨てる', moveToExhausted:'消滅させる', moveToDraw:'山札に戻す', moveToHand:'手札に移す',
    upgrade:'強化する', duplicate:'複製する', grantBuff:'効果を付与する', generateToHand:'生成する', generateToDraw:'生成する'})[op.type] || '選ぶ';
}
// 敵が使うカード操作の説明（視点反転後の内容）。効果のない操作は空文字を返す。
function enemyOpText(op){
  const lo = Math.min(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
  const hi = Math.max(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
  const n = op.countMode==='all' ? 'すべて'
    : op.countMode==='random' ? `${lo}〜${hi}枚`
    : `${op.countFixed!==undefined?op.countFixed:1}枚`;
  const tag = op.filterTag ? `[${op.filterTag}]の` : '';
  switch(op.type){
    case 'generateToEnemyDeck': return `カード${n}をあなたの山札に加える`;
    case 'moveToDiscard': case 'moveToExhausted': return `自分のデッキから${tag}カード${n}を取り除く`;
    case 'upgrade': return `自分のデッキの${tag}カード${n}を強化する`;
    case 'duplicate': return `自分のデッキの${tag}カード${n}を複製する`;
    case 'play': return `自分のデッキの${tag}カード${n}を即座に使う`;
    case 'generateToHand': case 'generateToDraw': return `カード${n}を生成し、自分のデッキに加える`;
    case 'generatePlay': return `カード${n}を生成し、即座に使う`;
    case 'grantBuff': {
      const def = EFFECT_FIELD_DEFS.find(d=>d.key===op.buffField);
      const name = def ? def.label.replace(/（.*$/,'') : (op.buffField||'');
      const amt = op.buffAmount||0;
      return `自分のデッキの${tag}カード${n}の${name}${amt>=0?'+':''}${amt}`;
    }
    default: return ''; // moveToHand / moveToDraw: 敵のデッキでは効果なし
  }
}
function queueTurnStartOp(r, op, label){
  if(!r.pendingTurnStartOps) r.pendingTurnStartOps = [];
  const o = {...op, prompt: `${label}：${opChooseVerb(op)}カードを選んでください`};
  r.pendingTurnStartOps.push({op:o, label});
}
function runTurnStartCardOps(r, done){
  const list = r.pendingTurnStartOps || [];
  r.pendingTurnStartOps = [];
  let i = 0;
  (function next(){
    if(i>=list.length || r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
    const item = list[i++];
    pushLog(item.op.fromEnemy ? item.label : `${item.label}が発動。`);
    resolveCardOp(r, item.op, next);
  })();
}

// Bridges custom statuses into the same "effect field" vocabulary cards/relics already
// use (damage, block, strength...) by keying each one as "cs_<statusId>" on the card or
// relic-effect object. Because the key format matches EFFECT_FIELD_DEFS exactly, every
// generic loop that already walks EFFECT_FIELD_DEFS (the editor's field rows, the card
// description, upgradedCardView, relicFieldDefsFor) works for custom statuses for free
// once it walks allEffectFieldDefs() instead.
// 状態の付与先。カード側の設定（csT_<状態ID>）があればそれを優先し、なければ状態の「標準の付与先」を使う。
// 戻り値は 'self'（行動する本人）、'opponent'（相手）、'both'（両方。基本値＝自分への量、csX_<状態ID>＝相手への量）。
function csGrantSide(obj, st){
  const t = obj && obj['csT_'+st.id];
  if(t==='self' || t==='opponent' || t==='both') return t;
  return st.target==='opponent' ? 'opponent' : 'self';
}
function customStatusFieldDefs(){
  return (S.customStatuses||[]).map(st=>({
    key: 'cs_'+st.id,
    label: `${st.emoji?st.emoji+' ':''}${st.name} 付与`,
    max: 99,
    min: -99,   // 負の値＝スタックを減らす
    desc: (v, obj)=>{
      const nm = `${st.emoji?st.emoji+' ':''}${st.name}`;
      const sg = n=> n>0 ? `+${n}` : `${n}`;
      const side = csGrantSide(obj, st);
      if(side==='both'){
        const x = (obj && obj['csX_'+st.id])|0;
        return [v!==0 ? `${nm}${sg(v)}（自分に）` : '', x!==0 ? `${nm}${sg(x)}（相手に）` : ''].filter(Boolean).join('／');
      }
      return `${nm}${sg(v)}${side==='opponent'?'（相手に）':'（自分に）'}`;
    },
    _statusId: st.id,
  }));
}
function allEffectFieldDefs(){ return EFFECT_FIELD_DEFS.concat(customStatusFieldDefs()); }

/* ===== Enemies using cards as their moves =====
   An enemy's move pattern is just a list of card ids. Enemies have no hand/deck, so draw
   and energy are not supported here. Scaling ("参照増減") works from the enemy's point of
   view, and trigger timing ("仕込み") is supported (see fireEnemyTriggers). The numeric
   effects that make sense for a single move: damage, block, buffs/debuffs,
   heal, pierce/lifesteal, hits (repeat count) and custom statuses. Custom statuses
   route through the same target ('self'/'opponent') as they do for cards, just with
   the enemy as the actor instead of the player. */
function resolveEnemyMoveEffects(r, e, c){
  const prior = (e.triggers||[]).slice();   // この行動より前に仕込まれていた構え
  logGroupBegin(`${e.name}：${cardIcon(c)}${c.name}`);
  resolveEnemyMoveBody(r, e, c);
  // 「カードを使うたび」の構え：敵自身がカードを使ったときに発動（今使ったカードで仕込んだ構えは対象外）
  fireEnemyTriggers(r, 'cardUsed', {card: c}, prior);
  logGroupEnd();
}
function resolveEnemyMoveBody(r, e, c){
  // 仕込み（トリガー発動）のカードは、行動した時点では効果を出さず、きっかけを待つ
  if(c.timing==='trigger'){
    e.triggers = e.triggers || [];
    e.triggers.push({
      card: c,
      triggerOn: c.triggerOn==='damaged' ? 'damaged' : 'cardUsed',
      triggerTag: c.triggerTag || '',
      triggerBlocked: !!c.triggerBlocked,
      duration: c.duration==='turn' ? 'turn' : 'combat',
    });
    pushLog(`${e.name}は「${c.name}」の構えをとった。`);
    return;
  }
  applyEnemyCardPayload(r, e, c);
}
// 敵のカード効果の本体（行動時、および仕込みの発動時に使う）
function applyEnemyCardPayload(r, e, c){
  const p = r.player;
  const replays = Math.max(1, (c.hits||1) + scaleBonus(c,'hits','enemy'));
  for(let rep=0; rep<replays; rep++){
    if(e.hp<=0 || p.hp<=0) break;
    const V = key=> enemyVal(c, key);
    const Lg = o=> logStat({name:`${e.name}：${c.name}`, ...o});
    const eGain = (ent, who, ek, field, v, base, eff, state, legacy)=>{
      if(v<=0) return;
      const before = ent[field]||0;
      if(grantBuiltin(ent, field, v)===0) return;   // 排他で付与されなかった
      Lg({who, key:ek+':'+field, eff, v, base, before, after:ent[field], state:state||eff, legacy});
    };
    const steps = {
      damage(){
        const dmg = V('damage');
        if(!(dmg>0)) return;
        applyDamageToPlayer(dmg + e.strength, c.pierce);
        const lh = r.lastHit;
        if(lh && lh.total>0){ (r.damageEvents = r.damageEvents||[]).push({...lh}); }
        logEnemyHit(e, c, lh, {base:c.damage||0, scale:dmg-(c.damage||0), str:e.strength});
        const st = r.enemyTurnStat;
        if(st && lh && lh.total>0){ st.hits++; st.total += lh.total; st.blocked += lh.blocked; st.hpLoss += lh.hpBefore - lh.hpAfter; }
        // 吸収: ブロックで防がれた分は回復しない。実際にHPを減らせた分だけ回復する。
        if(c.lifesteal){
          const heal = lh ? lh.hpLoss : 0;
          if(heal>0){ const b = e.hp; e.hp = Math.min(e.maxHp, e.hp + heal); pushLog(`${e.name}は吸収で${e.hp-b}回復（敵HP ${b}→${e.hp}）。`, 'deal'); }
          else if(lh && lh.total>0) pushLog(`${e.name}の吸収: 全て防がれたので回復なし。`, 'guard');
        }
        const reflectTotal = p.thorns + p.permThorns + customReflectDamage(p);
        if(reflectTotal>0){
          const eBefore = e.hp;
          e.hp = Math.max(0, e.hp - reflectTotal);
          pushLog(`棘によって${e.name}に${reflectTotal}ダメージ（敵HP ${eBefore}→${e.hp}）。`, 'deal');
        }
      },
      block(){
        const blk = V('block');
        if(!(blk>0)) return;
        const total = Math.max(0, blk + customBlockGainBonus(e));
        const bBefore = e.block;
        e.block += total;
        logBlockGain(`${e.name}：${c.name}`, e.name, 'e', total, {base:c.block||0, scale:blk-(c.block||0), flats:[{v:customBlockGainBonus(e), label:'状態'}]}, bBefore, e.block);
      },
      heal(){
        const heal = V('heal');
        if(!(heal>0)) return;
        const before = e.hp; e.hp = Math.min(e.maxHp, e.hp + heal);
        Lg({who:e.name, key:'e:hp', eff:'回復', v:heal, base:c.heal||0, before, after:e.hp, state:'HP'});
      },
      strength(){ eGain(e, e.name, 'e', 'strength', V('strength') + V('permStrength'), (c.strength||0)+(c.permStrength||0), '強化', '強化', v=>`${e.name}は力を高めた！ 強化+${v}。`); },
      dexterity(){ eGain(e, e.name, 'e', 'dexterity', V('dexterity') + V('permDexterity'), (c.dexterity||0)+(c.permDexterity||0), '器用'); },
      metallicize(){ eGain(e, e.name, 'e', 'metallicize', V('metallicize') + V('permMetallicize'), (c.metallicize||0)+(c.permMetallicize||0), '自動ブロック'); },
      thorns(){ eGain(e, e.name, 'e', 'thorns', V('thorns') + V('permThorns'), (c.thorns||0)+(c.permThorns||0), '棘'); },
      weak(){ eGain(p, 'あなた', 'p', 'weak', V('weak'), c.weak||0, '弱体', '弱体', v=>`${e.name}の効果で弱体+${v}。`); },
      vulnerable(){ eGain(p, 'あなた', 'p', 'vulnerable', V('vulnerable'), c.vulnerable||0, '脆弱', '脆弱', v=>`${e.name}の効果で脆弱+${v}。`); },
      poison(){ eGain(p, 'あなた', 'p', 'poison', V('poison'), c.poison||0, '毒', '毒', v=>`${e.name}の効果で毒+${v}。`); },
      statusOp(){ applyStatusOp(c.statusOp, e, p, e.name); },
    };
    customStatusFieldDefs().forEach(def=>{
      steps[def.key] = ()=>{
        const base0 = c[def.key]||0;
        const amt = base0 + scaleBonus(c, def.key, 'enemy');   // 負の値は、スタックを減らす
        const stDef = (S.customStatuses||[]).find(s=>s.id===def._statusId);
        if(!stDef) return;
        const side = csGrantSide(c, stDef);
        const extra = side==='both' ? ((c['csX_'+stDef.id])|0) : 0;
        if(amt===0 && extra===0) return;
        const nm = `${stDef.emoji||''}${stDef.name}`;
        const give = (ent, who, ek, n, base)=>{
          const before = customStatusStacks(ent, stDef.id);
          if(grantCustomStatus(ent, stDef.id, n)===0 && n>0) return;   // 排他で付与されなかった
          Lg({who, key:`${ek}:cs:${stDef.id}`, eff:nm, v:n, base, before, after:customStatusStacks(ent, stDef.id), state:nm});
        };
        if(side==='both'){
          if(amt!==0) give(e, e.name, 'e', amt, base0);       // 基本値＝行動する敵本人への量
          if(extra!==0) give(p, 'あなた', 'p', extra, extra);   // 相手（プレイヤー）への量
        } else if(side==='opponent') give(p, 'あなた', 'p', amt, base0);
        else give(e, e.name, 'e', amt, base0);
        if(!LOG_UNIFIED) pushLog(`${e.name}: ${def.desc(amt, c)}`);
      };
    });
    orderedEffectIds(c, ENEMY_EFFECT_ORDER, ENEMY_PERM_ALIAS).forEach(id=>{ if(steps[id]) steps[id](); });
  }
}
// 敵が仕込んだトリガーの発動。kind='cardUsed'（敵自身が指定タグのカードを使った）／'damaged'（敵がダメージを受けた）
function fireEnemyTriggers(r, kind, info, list){
  const e = r.enemy;
  if(!e || !e.triggers || !e.triggers.length || e.hp<=0 || r.player.hp<=0) return;
  (list || e.triggers.slice()).forEach(t=>{
    if(!e.triggers.includes(t)) return;
    if(t.triggerOn!==kind) return;
    if(e.hp<=0 || r.player.hp<=0) return;
    if(kind==='cardUsed'){
      if(t.triggerTag && !((info.card && info.card.tags)||[]).includes(t.triggerTag)) return;
    } else {
      if(!(info.hpLoss>0 || (t.triggerBlocked && info.total>0))) return;
    }
    pushLog(`${e.name}の「${t.card.name}」が発動！`);
    applyEnemyCardPayload(r, e, t.card);
  });
}

// Fields an enemy can be given "at combat start" (from the enemy editor). Permanent-
// stacking fields are excluded (a freshly-spawned enemy has no meaningful "permanent");
// weak/vulnerable/poison mean "applied to the player" and strength/dexterity/metallicize/
// thorns/heal mean "applied to the enemy itself", matching how those fields already work
// everywhere else (a card's weak always debuffs the opponent; its strength buffs its user).
function enemyStartFieldDefs(){
  const allowed = ['strength','dexterity','metallicize','thorns','weak','vulnerable','poison','heal'];
  return EFFECT_FIELD_DEFS.filter(d=>allowed.includes(d.key)).concat(customStatusFieldDefs());
}
function applyEnemyStartEffects(r, e, effect){
  const eff = effect||{};
  const strength = Math.max(0, eff.strength||0); if(strength>0) grantBuiltin(e, 'strength', strength);
  const dexterity = Math.max(0, eff.dexterity||0); if(dexterity>0) grantBuiltin(e, 'dexterity', dexterity);
  const metallicize = Math.max(0, eff.metallicize||0); if(metallicize>0) grantBuiltin(e, 'metallicize', metallicize);
  const thorns = Math.max(0, eff.thorns||0); if(thorns>0) grantBuiltin(e, 'thorns', thorns);
  const weak = Math.max(0, eff.weak||0); if(weak>0) grantBuiltin(r.player, 'weak', weak);
  const vulnerable = Math.max(0, eff.vulnerable||0); if(vulnerable>0) grantBuiltin(r.player, 'vulnerable', vulnerable);
  const poison = Math.max(0, eff.poison||0); if(poison>0) grantBuiltin(r.player, 'poison', poison);
  const heal = Math.max(0, eff.heal||0); if(heal>0) e.hp = Math.min(e.maxHp, e.hp + heal);
  customStatusFieldDefs().forEach(def=>{
    const amt = Math.max(0, eff[def.key]||0);
    if(amt<=0) return;
    const stDef = (S.customStatuses||[]).find(s=>s.id===def._statusId);
    if(!stDef) return;
    // 付与先は敵の視点: 'opponent'＝プレイヤー、'self'＝敵自身。敵ごとの設定（csT_）を優先し、なければ状態の標準。
    const target = csGrantSide(eff, stDef)==='opponent' ? r.player : e;
    if(grantCustomStatus(target, stDef.id, amt)===0 && amt>0) return;   // 排他で付与されなかった
    pushLog(`${e.name}: ${def.desc(amt, eff)}`);
  });
}

/* ============================= CARD OPERATIONS (advanced) ============================= */

const CARDOP_TYPES = [
  {key:'moveToHand', label:'手札に移動する'},
  {key:'moveToDiscard', label:'捨て札に移動する'},
  {key:'moveToDraw', label:'山札に加える（シャッフル）'},
  {key:'moveToExhausted', label:'消滅させる'},
  {key:'upgrade', label:'その場で強化する'},
  {key:'duplicate', label:'複製する（捨て札に複製を追加）'},
  {key:'play', label:'コストを消費せず使用する'},
  {key:'grantBuff', label:'カードに効果を付与する'},
  {key:'generateToHand', label:'カードを生成し、手札に加える'},
  {key:'generateToDraw', label:'カードを生成し、山札に加える'},
  {key:'generatePlay', label:'カードを生成し、コストを消費せず使用する'},
  {key:'generateToEnemyDeck', label:'カードを生成し、敵のデッキに加える（この戦闘中のみ）'},
];
const GENERATE_TYPES = ['generateToHand','generateToDraw','generatePlay','generateToEnemyDeck'];
// Ops whose result normally only lasts for the current combat (reverted afterwards),
// unless the op is flagged "permanent".
const CARDOP_REVERTIBLE_TYPES = ['upgrade','duplicate','grantBuff','moveToExhausted','generateToHand','generateToDraw','generatePlay'];
const PILE_OPTIONS = [
  {key:'hand', label:'手札'},
  {key:'draw', label:'山札'},
  {key:'discard', label:'捨て札'},
  {key:'exhausted', label:'消滅済み'},
  {key:'drawAndDiscard', label:'山札+捨て札（合算）'},
];
// A cardOp's "from pile" can point at more than one actual pile array at once
// (currently just "drawAndDiscard"). This maps the selectable key to the real
// r.<pile> array name(s) it draws candidates from.
const PILE_SOURCES = {
  hand: ['hand'], draw: ['draw'], discard: ['discard'], exhausted: ['exhausted'],
  drawAndDiscard: ['draw','discard'],
};
const GENERATE_POOL_OPTIONS = [
  {key:'normal', label:'通常のカードのみ（生成専用カードを除く）'},
  {key:'exclusiveOnly', label:'生成専用・敵専用カードのみ'},
  {key:'any', label:'すべてのカード'},
];

// For "add to the enemy's deck" the pool is the cards an enemy is allowed to use
// (usableBy enemy / both); the same three keys then mean:
const ENEMY_DECK_POOL_OPTIONS = [
  {key:'normal', label:'通常のカードのみ（生成専用カードを除く）'},
  {key:'exclusiveOnly', label:'生成専用カードのみ（敵の攻撃・防御など）'},
  {key:'any', label:'すべてのカード'},
];
function genPoolOptionsFor(opType){
  return opType==='generateToEnemyDeck' ? ENEMY_DECK_POOL_OPTIONS : GENERATE_POOL_OPTIONS;
}
function genPoolLabel(op){
  return (genPoolOptionsFor(op.type).find(p=>p.key===op.genPool)||{}).label || op.genPool;
}

// Every candidate a cardOp can act on is represented the same way, whether it comes
// from an existing pile (pile+idx known, so it can be moved/mutated in place) or from
// the master card list for a "generate" op (pile/idx are null — it doesn't exist yet).
function collectPileEntries(r, fromPileKey){
  const pileNames = PILE_SOURCES[fromPileKey] || [fromPileKey];
  const entries = [];
  pileNames.forEach(pn=>{
    const arr = r[pn];
    if(!arr) return;
    arr.forEach((rawId,i)=> entries.push({pile:pn, idx:i, rawId}));
  });
  return entries;
}
function collectGeneratePool(op){
    return S.cards.filter(c=>{
    if(op.filterTag && !(c.tags && c.tags.includes(op.filterTag))) return false;
    if(op.genPool==='exclusiveOnly') return isNonRewardCard(c);
    if(op.genPool==='normal') return !isNonRewardCard(c);
    return true; // 'any'
  }).map(c=>({pile:null, idx:null, rawId:c.id}));
}
// Removes a set of already-selected entries from their source piles. Entries are
// grouped by pile and spliced highest-index-first so earlier indices stay valid.
function removeEntries(r, entries){
  const byPile = {};
  entries.forEach(e=>{ if(e.pile) (byPile[e.pile] = byPile[e.pile]||[]).push(e.idx); });
  Object.keys(byPile).forEach(pileName=>{
    byPile[pileName].sort((a,b)=>b-a).forEach(i=> r[pileName].splice(i,1));
  });
}
function pickWithReplacement(entries, count){
  const out = [];
  if(entries.length===0) return out;
  for(let i=0;i<count;i++) out.push(entries[Math.floor(Math.random()*entries.length)]);
  return out;
}

// Resolves a single card-operation. Most operation types finish synchronously, but
// countMode "choose" hands control to the player (via r.pendingChoice) and only calls
// done() once they confirm a selection — so every caller of resolveCardOp must treat
// it as asynchronous and continue its own work from inside `done`.
// 敵が使うカード操作は、視点が反転する:
//  ・「敵のデッキに加える」→ 敵から見た相手＝プレイヤーの山札に加える（この戦闘中のみ）
//  ・それ以外 → 敵自身のデッキ（r.enemy.deck）に作用する。敵には手札・山札・捨て札の区別がないので
//    「対象の山」は無視する。「捨て札に移動」「消滅」はデッキから取り除く（最後の1枚は残す）。
//    「手札に移動」「山札に加える（既存カード）」は効果なし。プレイヤーが選ぶ設定はランダムになる。
// 敵のデッキは戦闘ごとに作り直されるため、変更はこの戦闘中のみ有効。
function enemyFreePlay(r, e, rawId){
  const c = cardById(rawId);
  if(!c || e.hp<=0 || r.player.hp<=0) return;
  pushLog(`${e.name}は「${c.name}」をコストなしで使った。`);
  resolveEnemyMoveEffects(r, e, c);
}
function resolveEnemyCardOp(r, op, done){
  const e = r.enemy;
  const rollCount = (avail)=>{
    if(op.countMode==='all') return avail;
    if(op.countMode==='random'){
      const a = op.countMin!==undefined?op.countMin:1, b = op.countMax!==undefined?op.countMax:1;
      const lo = Math.min(a,b), hi = Math.max(a,b);
      return lo + Math.floor(Math.random()*(hi-lo+1));
    }
    return op.countFixed!==undefined ? op.countFixed : 1;
  };
  const nameOf = rawId=>{ const c = cardById(rawId); return c ? c.name : rawId; };

  if(GENERATE_TYPES.includes(op.type)){
    const pool = collectGeneratePool(op);
    if(pool.length===0){ done(); return; }
    const count = Math.max(0, rollCount(pool.length));
    const picked = pickWithReplacement(pool, count);
    if(picked.length===0){ done(); return; }
    const names = picked.map(x=>nameOf(x.rawId)).join('」「');
    if(op.type==='generateToEnemyDeck'){
      const newIds = picked.map(x=>{
        const iid = newId();
        r.temporaryCardIids[iid] = true;
        return withInstanceSuffix(x.rawId, iid);
      });
      r.draw = shuffle([...r.draw, ...newIds]);
      pushLog(`${e.name}があなたの山札に「${names}」を加えた。`);
    } else if(op.type==='generatePlay'){
      pushLog(`${e.name}は「${names}」を生成した。`);
      picked.forEach(x=> enemyFreePlay(r, e, x.rawId));
    } else {
      const w = Math.max(1, op.deckWeight||1);
      picked.forEach(x=>{ e.deck.push({cardId:x.rawId, weight:w, temp:true}); });
      pushLog(`${e.name}のデッキに「${names}」が加わった（重み${w}）。`);
    }
    done(); return;
  }

  if(op.type==='moveToHand' || op.type==='moveToDraw'){ done(); return; }
  let entries = e.deck.map((d,i)=>({idx:i, d}));
  if(op.filterTag) entries = entries.filter(x=>{ const c = cardById(x.d.cardId); return c && c.tags && c.tags.includes(op.filterTag); });
  if(op.type==='upgrade') entries = entries.filter(x=>!isUpgradedInstanceId(x.d.cardId));
  let count = Math.min(entries.length, Math.max(0, rollCount(entries.length)));
  if(op.type==='moveToDiscard' || op.type==='moveToExhausted') count = Math.min(count, e.deck.length-1);
  if(count<=0){ done(); return; }
  const sel = shuffle(entries).slice(0, count);
  const names = sel.map(x=>nameOf(x.d.cardId)).join('」「');

  if(op.type==='moveToDiscard' || op.type==='moveToExhausted'){
    sel.map(x=>x.idx).sort((a,b)=>b-a).forEach(i=> e.deck.splice(i,1));
    pushLog(`${e.name}のデッキから「${names}」が取り除かれた。`);
  } else if(op.type==='upgrade'){
    sel.forEach(x=>{ x.d.cardId = upgradeRawId(x.d.cardId); });
    pushLog(`${e.name}のデッキの「${names}」が強化された。`);
  } else if(op.type==='duplicate'){
    sel.forEach(x=>{ e.deck.push({cardId:splitInstanceId(x.d.cardId).cid, weight:x.d.weight||1, temp:true}); });
    pushLog(`${e.name}のデッキに「${names}」の複製が加わった。`);
  } else if(op.type==='grantBuff'){
    const field = op.buffField, amount = op.buffAmount||0;
    if(field && amount){
      sel.forEach(x=>{
        const {cid, iid} = splitInstanceId(x.d.cardId);
        const useIid = iid || newId();
        if(!r.tempInstanceBuffs[useIid]) r.tempInstanceBuffs[useIid] = {};
        r.tempInstanceBuffs[useIid][field] = (r.tempInstanceBuffs[useIid][field]||0) + amount;
        x.d.cardId = withInstanceSuffix(cid, useIid);
      });
      const fd = EFFECT_FIELD_DEFS.find(d=>d.key===field);
      pushLog(`${e.name}のデッキの「${names}」に「${fd?fd.label:field}」${amount>=0?'+':''}${amount}が付与された。`);
    }
  } else if(op.type==='play'){
    sel.forEach(x=> enemyFreePlay(r, e, x.d.cardId));
  }
  done();
}

function resolveCardOp(r, op, done){
  if(!op || !op.enabled){ done(); return; }
  if(op.fromEnemy){ resolveEnemyCardOp(r, op, done); return; }
  // The player never picks which card goes into the enemy's deck: "choose" acts as "fixed".
  if(op.type==='generateToEnemyDeck' && op.countMode==='choose') op = {...op, countMode:'fixed'};

  // "Re-pick one at a time": instead of choosing every target up front, pick one, resolve it,
  // then pick the next from the pile as it stands afterwards (so cards drawn/moved by the
  // first one can be picked, and a "choose" op prompts the player once per card).
  if(op.sequential && op.countMode!=='all'){
    let n;
    if(op.countMode==='random'){
      const lo = Math.min(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
      const hi = Math.max(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
      n = lo + Math.floor(Math.random()*(hi-lo+1));
    } else n = op.countFixed!==undefined ? op.countFixed : 1;
    const single = {...op, sequential:false, countMode: op.countMode==='choose' ? 'choose' : 'fixed', countFixed:1};
    let i = 0;
    (function nextPick(){
      if(i>=n || r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
      i++;
      resolveCardOp(r, single, nextPick);
    })();
    return;
  }
  const isGenerate = GENERATE_TYPES.includes(op.type);

  // 「山札から手札へ移動」は通常のドローと同じ扱い：山札が足りないときは捨て札を山札に戻す
  if(op.type==='moveToHand' && (op.fromPile||'hand')==='draw' && op.countMode!=='all'){
    const need = op.countMode==='random'
      ? Math.max(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1)
      : (op.countFixed!==undefined ? op.countFixed : 1);
    if(r.draw.length < need && r.discard.length>0){
      r.draw = shuffle([...r.draw, ...r.discard]);
      r.discard = [];
      pushLog('捨札を山札に戻した。');
    }
  }

  let entries = isGenerate ? collectGeneratePool(op) : collectPileEntries(r, op.fromPile || 'hand');
  if(!isGenerate && op.filterTag){
    entries = entries.filter(e=>{
      const cc = cardById(e.rawId);
      return cc && cc.tags && cc.tags.includes(op.filterTag);
    });
  }
  if(op.type==='upgrade'){
    entries = entries.filter(e=>!isUpgradedInstanceId(e.rawId));
  }
  if(entries.length===0){ done(); return; }

  function finish(selected){
    if(selected.length===0){ done(); return; }

    // Added to the enemy's list of possible moves for the rest of this battle. The enemy
    // object is rebuilt for every battle, so nothing carries over. The move already
    // shown as the intent is not changed; the new entries count from the next roll on.
    if(op.type==='generateToEnemyDeck'){
      const w = Math.max(1, op.deckWeight||1);
      selected.forEach(e=>{ r.enemy.deck.push({cardId:e.rawId, weight:w, temp:true}); });
      const names = selected.map(e=>{ const cc = cardById(e.rawId); return cc ? cc.name : e.rawId; });
      pushLog(`${r.enemy.name}のデッキに「${names.join('」「')}」が加わった（重み${w}）。`);
      done(); return;
    }

    if(isGenerate){
      const newIds = selected.map(e=>{
        const iid = newId();
        if(!op.permanent) r.temporaryCardIids[iid] = true;
        return withInstanceSuffix(e.rawId, iid);
      });
      if(op.type==='generateToHand'){
        r.hand.push(...newIds);
        pushLog(`${newIds.length}枚のカードを生成し、手札に加えた。`);
        done(); return;
      }
      if(op.type==='generateToDraw'){
        r.draw = shuffle([...r.draw, ...newIds]);
        pushLog(`${newIds.length}枚のカードを生成し、山札に加えた。`);
        done(); return;
      }
      // generatePlay
      pushLog(`${newIds.length}枚のカードを生成し、コストなしで使用した。`);
      let gi=0;
      (function nextGen(){
        if(gi>=newIds.length){ done(); return; }
        const rawId = newIds[gi++];
        const cc = cardById(rawId);
        if(!cc){ nextGen(); return; }
        if((r._autoPlayDepth||0) >= 4){
          pushLog(`${cc.name}: 連鎖が深すぎるため発動を打ち切った。`);
          r.discard.push(rawId);
          nextGen(); return;
        }
        r._autoPlayDepth = (r._autoPlayDepth||0) + 1;
        resolveCardPlayCore(r, cc, ()=>{
          r._autoPlayDepth -= 1;
          if(cc.exhaust) r.exhausted.push(rawId); else r.discard.push(rawId);
          nextGen();
        });
      })();
      return;
    }

    if(op.type==='upgrade'){
      selected.forEach(e=>{
        if(op.permanent){
          r[e.pile][e.idx] = upgradeRawId(e.rawId);
        } else {
          // Temporary upgrade: the copy needs its own identity so it can be reverted
          // (and only it) once the combat is over.
          const {cid, iid} = splitInstanceId(e.rawId);
          const useIid = iid || newId();
          r.tempUpgradeIids[useIid] = true;
          r[e.pile][e.idx] = withInstanceSuffix(cid+'+', useIid);
        }
      });
      pushLog(`${selected.length}枚のカードを強化した${op.permanent?'（永続）':'（この戦闘中のみ）'}。`);
      done(); return;
    }
    if(op.type==='duplicate'){
      // A duplicate is a fresh, unbuffed copy of the base card — it does not inherit
      // any per-instance buff granted to the original physical card. Unless permanent,
      // the copy is registered as temporary and vanishes when the combat ends.
      selected.forEach(e=>{
        const cid = splitInstanceId(e.rawId).cid;
        if(op.permanent){ r.discard.push(cid); }
        else{
          const iid = newId();
          r.temporaryCardIids[iid] = true;
          r.discard.push(withInstanceSuffix(cid, iid));
        }
      });
      pushLog(`${selected.length}枚のカードを複製した${op.permanent?'（永続）':'（この戦闘中のみ）'}。`);
      done(); return;
    }
    if(op.type==='grantBuff'){
      const field = op.buffField; const amount = op.buffAmount||0;
      if(field && amount){
        const store = op.permanent ? r.instanceBuffs : r.tempInstanceBuffs;
        selected.forEach(e=>{
          const {cid, iid} = splitInstanceId(e.rawId);
          const useIid = iid || newId();
          if(!store[useIid]) store[useIid] = {};
          store[useIid][field] = (store[useIid][field]||0) + amount;
          r[e.pile][e.idx] = withInstanceSuffix(cid, useIid);
        });
        const fieldDef = EFFECT_FIELD_DEFS.find(d=>d.key===field);
        pushLog(`${selected.length}枚のカードに「${fieldDef?fieldDef.label:field}」${amount>=0?'+':''}${amount}を付与した。`);
      }
      done(); return;
    }
    if(op.type==='play'){
      // Auto-play the targeted cards for free (no energy cost, not counted as
      // hand-play). Guard against runaway chains (a card auto-playing cards that
      // in turn auto-play more cards) with a small recursion depth cap.
      removeEntries(r, selected);
      pushLog(`${selected.length}枚のカードをコストなしで使用した。`);
      let pi=0;
      (function nextPlay(){
        if(pi>=selected.length){ done(); return; }
        const e = selected[pi++];
        const cc = cardById(e.rawId);
        if(!cc){ nextPlay(); return; }
        if((r._autoPlayDepth||0) >= 4){
          pushLog(`${cc.name}: 連鎖が深すぎるため発動を打ち切った。`);
          r.discard.push(e.rawId);
          nextPlay(); return;
        }
        r._autoPlayDepth = (r._autoPlayDepth||0) + 1;
        resolveCardPlayCore(r, cc, ()=>{
          r._autoPlayDepth -= 1;
          if(cc.exhaust) r.exhausted.push(e.rawId); else r.discard.push(e.rawId);
          nextPlay();
        });
      })();
      return;
    }
    const destMap = {moveToHand:'hand', moveToDiscard:'discard', moveToDraw:'draw', moveToExhausted:'exhausted'};
    const dest = destMap[op.type];
    if(!dest){ done(); return; }
    if(op.type==='moveToExhausted' && op.permanent){
      // Permanent exhaust: the card is destroyed for the rest of the run.
      removeEntries(r, selected);
      selected.forEach(e=>{
        const {iid} = splitInstanceId(e.rawId);
        if(iid){ delete r.instanceBuffs[iid]; delete r.tempInstanceBuffs[iid]; delete r.tempUpgradeIids[iid]; }
      });
      pushLog(`${selected.length}枚のカードを永久に消滅させた。`);
      done(); return;
    }
    removeEntries(r, selected);
    const movedIds = selected.map(e=>e.rawId);
    if(dest==='draw'){ r.draw = shuffle([...r.draw, ...movedIds]); }
    else{ r[dest].push(...movedIds); }
    if(dest==='hand'){
      // 山札から手札に来たカードは、通常のドローと同じく「引いたとき」の効果が発動する
      selected.forEach(e=>{ if(e.pile==='draw') applyCardDrawEffect(r, cardById(e.rawId)); });
    }
    pushLog(`${movedIds.length}枚のカードを${{hand:'手札に',discard:'捨て札に',draw:'山札に',exhausted:'消滅済みに'}[dest]}移動した。`);
    done();
  }

  if(op.countMode==='choose'){
    const need = Math.min(Math.max(op.countFixed!==undefined?op.countFixed:1, 0), entries.length);
    if(need<=0){ done(); return; }
    r.pendingChoice = {
      candidates: entries,
      need,
      selectedIdx: [],
      prompt: op.prompt || '',
      onConfirm: (chosen)=>{ finish(chosen); },
    };
    renderBattle();
    return;
  }

  let count;
  if(op.countMode==='all') count = entries.length;
  else if(op.countMode==='random'){
    const lo = Math.min(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
    const hi = Math.max(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
    count = lo + Math.floor(Math.random()*(hi-lo+1));
  } else count = op.countFixed!==undefined ? op.countFixed : 1;

  const selected = isGenerate
    ? pickWithReplacement(entries, Math.max(0,count))
    : shuffle(entries.slice()).slice(0, Math.max(0,count));
  finish(selected);
}

// Applies a card's own numeric effects (damage/block/draw/buffs/debuffs/card-op...),
// repeated according to its "hits" field. This is shared by a normal hand-play, by a
// trigger firing later, and by cardOp's "play"/"generatePlay" (free auto-play) types.
// Continuation-passing: calls done() once every repetition (and any card-op inside it,
// including ones that pause for a player choice) has fully resolved.
// Applies every "numeric effect" field (damage/block/draw/buffs/debuffs/heal/etc.) a
// single time. Shared by applyCardEffects's repeat loop (cards/triggers) and by the
// relic timed-effect resolver, which doesn't want a repeat loop or the "already dead"
// early-exit that combat-end relics would otherwise trip on.
// ===== 効果の処理順 =====
// カードの effectOrder（効果の項目キーの配列）に従って処理する。載っていない効果は、従来の順で後ろに付く。
// 項目キーは、カード編集の効果欄のキー（damage, block, strength, cs_xxx …）と、状態の操作（statusOp）。
const PLAYER_EFFECT_ORDER = ['damage','block','draw','energy','strength','permStrength','dexterity','permDexterity',
  'metallicize','permMetallicize','thorns','permThorns','weak','vulnerable','poison','stun','reduceEnemyStrength',
  'selfWeak','selfVulnerable','selfPoison','heal','regen','loseHp'];
const ENEMY_EFFECT_ORDER = ['damage','block','heal','strength','dexterity','metallicize','thorns','weak','vulnerable','poison'];
// 敵側では、永続の項目は戦闘中の項目と同じ処理（まとめて1回）なので、順番の指定も同じ項目として数える
const ENEMY_PERM_ALIAS = {permStrength:'strength', permDexterity:'dexterity', permMetallicize:'metallicize', permThorns:'thorns'};
function defaultEffectOrder(c, base){
  const ids = base.concat(customStatusFieldDefs().map(d=>d.key), ['statusOp']);
  // 旧設定「状態の操作を付与より先に実行」は、ドローの前に置く順番として読み替える
  if(c && c.statusOp && c.statusOp.first && base.includes('draw')){
    ids.splice(ids.indexOf('statusOp'),1);
    ids.splice(ids.indexOf('draw'),0,'statusOp');
  } else if(c && c.statusOp && c.statusOp.first){
    ids.splice(ids.indexOf('statusOp'),1);
    ids.splice(ids.indexOf('strength'),0,'statusOp');
  }
  return ids;
}
function orderedEffectIds(c, base, alias){
  const defaults = defaultEffectOrder(c, base);
  const out = [];
  (Array.isArray(c && c.effectOrder) ? c.effectOrder : []).forEach(id=>{
    const k = (alias && alias[id]) || id;
    if(defaults.includes(k) && !out.includes(k)) out.push(k);
  });
  defaults.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  return out;
}

function applyEffectValues(r, c){
  // 戦闘前（最初のレリック選択など）は敵がまだいない。敵向けの効果は、受け皿の仮の敵に入れて捨てる。
  const P = r.player, E = r.enemy || {name:'敵', hp:1, maxHp:1, block:0, strength:0, dexterity:0, weak:0, vulnerable:0, poison:0, stun:0, thorns:0, customStatus:{}, triggers:[]};
  const val = k=> Math.max(0, (c[k]||0) + scaleBonus(c,k));
  const L = o=> logStat({name:c.name, ...o});
  // 数値を足す効果（強化・弱体・毒など）の共通処理
  const gain = (who, ent, ek, field, key, eff, state, legacy)=>{
    const base = c[key]||0, v = val(key);
    if(v<=0) return;
    const before = ent[field]||0;
    if(grantBuiltin(ent, field, v)===0) return;   // 排他で付与されなかった
    L({who, key:ek+':'+field, eff, v, base, before, after:ent[field], state:state||eff, legacy});
  };
  const steps = {
    damage(){
      const dmgBase = c.damage||0;
      const dmgVal = Math.max(0, dmgBase + scaleBonus(c,'damage'));
      if(!(dmgVal>0 && r.enemy)) return;
      const strTotal = r.player.strength + r.player.permStrength;
      applyDamageToEnemy(dmgVal + strTotal, c.pierce, h=> logPlayerHit(c, h, dmgBase, dmgVal-dmgBase, strTotal));
      // 吸収: ブロックで防がれた分は回復しない。実際に敵のHPを減らせた分だけ回復する。
      if(c.lifesteal){
        const lh = r.lastEnemyHit, heal = lh ? lh.hpLoss : 0;
        if(heal>0){ const b = r.player.hp; r.player.hp = Math.min(r.player.maxHp, r.player.hp + heal); pushLog(`${c.name}: 吸収でHPを${r.player.hp-b}回復（HP ${b}→${r.player.hp}）。`); }
        else if(lh && lh.total>0) pushLog(`${c.name}: 吸収は全て防がれたので回復なし。`);
      }
      // 敵が持つカスタム状態の「反射」: 攻撃を受けた敵が、攻撃した側にダメージを返す（ブロック無視）
      const foeReflect = r.enemy ? customReflectDamage(r.enemy) : 0;
      if(foeReflect>0 && r.enemy.hp>0 && r.player.hp>0){
        const pBefore = r.player.hp;
        r.player.hp = Math.max(0, r.player.hp - foeReflect);
        pushLog(`${r.enemy.name}の反射によって${foeReflect}ダメージを受けた（HP ${pBefore}→${r.player.hp}）。`, 'hit');
      }
    },
    block(){
      const blockVal = Math.max(0, (c.block||0) + scaleBonus(c,'block'));
      if(!(blockVal>0)) return;
      const total = Math.max(0, blockVal + r.player.dexterity + r.player.permDexterity + customBlockGainBonus(r.player));
      const bBefore = r.player.block;
      r.player.block += total;
      logBlockGain(c.name, 'あなた', 'p', total, {base:c.block||0, scale:blockVal-(c.block||0), flats:[{v:r.player.dexterity + r.player.permDexterity, label:'器用'},{v:customBlockGainBonus(r.player), label:'状態'}]}, bBefore, r.player.block);
    },
    draw(){
      const drawVal = val('draw');
      if(!(drawVal>0)) return;
      const before = r.hand.length; drawCards(drawVal);
      L({who:'あなた', key:'p:hand', eff:'ドロー', v:drawVal, base:c.draw||0, before, after:r.hand.length, state:'手札', legacy:`${c.name}: カードを${drawVal}枚引いた。`});
    },
    energy(){
      const energyVal = (c.energy||0) + scaleBonus(c,'energy');
      if(!energyVal) return;
      const before = P.energy; P.energy += energyVal;
      L({who:'あなた', key:'p:energy', eff:'エネルギー', v:energyVal, base:c.energy||0, before, after:P.energy});
    },
    strength(){ gain('あなた', P, 'p', 'strength', 'strength', '強化', '強化(戦闘中)', v=>`${c.name}: 強化+${v}（この戦闘中）。`); },
    permStrength(){ gain('あなた', P, 'p', 'permStrength', 'permStrength', '強化', '強化(永続)', v=>`${c.name}: 強化+${v}（永続）。`); },
    dexterity(){ gain('あなた', P, 'p', 'dexterity', 'dexterity', '器用', '器用(戦闘中)', v=>`${c.name}: 器用+${v}（この戦闘中）。`); },
    permDexterity(){ gain('あなた', P, 'p', 'permDexterity', 'permDexterity', '器用', '器用(永続)', v=>`${c.name}: 器用+${v}（永続）。`); },
    metallicize(){ gain('あなた', P, 'p', 'metallicize', 'metallicize', '自動ブロック', '自動ブロック(戦闘中)'); },
    permMetallicize(){ gain('あなた', P, 'p', 'permMetallicize', 'permMetallicize', '自動ブロック', '自動ブロック(永続)'); },
    thorns(){ gain('あなた', P, 'p', 'thorns', 'thorns', '棘', '棘(戦闘中)'); },
    permThorns(){ gain('あなた', P, 'p', 'permThorns', 'permThorns', '棘', '棘(永続)'); },
    weak(){ gain(E.name, E, 'e', 'weak', 'weak', '弱体'); },
    vulnerable(){ gain(E.name, E, 'e', 'vulnerable', 'vulnerable', '脆弱'); },
    poison(){ gain(E.name, E, 'e', 'poison', 'poison', '毒'); },
    stun(){ gain(E.name, E, 'e', 'stun', 'stun', '麻痺', '麻痺', v=>`${c.name}: 敵を${v}ターン麻痺させた。`); },
    reduceEnemyStrength(){
      const reduceStrVal = val('reduceEnemyStrength');
      if(!(reduceStrVal>0)) return;
      const before = E.strength;
      E.strength = Math.max(0, E.strength - reduceStrVal);
      // タグ「強化」を持つカスタム状態も、同じ量だけスタックが減る
      (S.customStatuses||[]).forEach(st=>{
        if((st.tags||[]).includes('強化') && customStatusStacks(E, st.id)>0) addCustomStatusStacks(E, st.id, -reduceStrVal);
      });
      L({who:E.name, key:'e:strength', eff:'強化減少', v:reduceStrVal, base:c.reduceEnemyStrength||0, before, after:E.strength, state:'強化', legacy:`${c.name}: 敵の強化を${reduceStrVal}減少させた。`});
    },
    selfWeak(){ gain('あなた', P, 'p', 'weak', 'selfWeak', '弱体'); },
    selfVulnerable(){ gain('あなた', P, 'p', 'vulnerable', 'selfVulnerable', '脆弱'); },
    selfPoison(){ gain('あなた', P, 'p', 'poison', 'selfPoison', '毒'); },
    heal(){
      const healVal = val('heal');
      if(!(healVal>0)) return;
      const before = P.hp; P.hp = Math.min(P.maxHp, P.hp + healVal);
      L({who:'あなた', key:'p:hp', eff:'回復', v:healVal, base:c.heal||0, before, after:P.hp, state:'HP'});
    },
    regen(){ gain('あなた', P, 'p', 'regen', 'regen', '再生'); },
    loseHp(){
      const loseHpVal = val('loseHp');
      if(!(loseHpVal>0)) return;
      const before = P.hp; P.hp = Math.max(0, P.hp - loseHpVal);
      L({who:'あなた', key:'p:hp', eff:'ダメージ(代償)', v:loseHpVal, base:c.loseHp||0, before, after:P.hp, state:'HP'});
    },
    statusOp(){ applyStatusOp(c.statusOp, r.player, r.enemy, c.name); },
  };
  customStatusFieldDefs().forEach(def=>{
    steps[def.key] = ()=>{
      const base0 = c[def.key]||0;
      const amt = base0 + scaleBonus(c, def.key);   // 負の値は、スタックを減らす
      const st = (S.customStatuses||[]).find(s=>s.id===def._statusId);
      if(!st) return;
      const side = csGrantSide(c, st);
      const extra = side==='both' ? ((c['csX_'+st.id])|0) : 0;
      if(amt===0 && extra===0) return;
      const nm = `${st.emoji||''}${st.name}`;
      const give = (ent, who, ek, n, base)=>{
        const before = customStatusStacks(ent, st.id);
        if(grantCustomStatus(ent, st.id, n)===0 && n>0) return;   // 排他で付与されなかった
        L({who, key:`${ek}:cs:${st.id}`, eff:nm, v:n, base, before, after:customStatusStacks(ent, st.id), state:nm});
      };
      if(side==='both'){
        if(amt!==0) give(P, 'あなた', 'p', amt, base0);
        if(extra!==0) give(E, E.name, 'e', extra, extra);
      } else if(side==='opponent') give(E, E.name, 'e', amt, base0);
      else give(P, 'あなた', 'p', amt, base0);
      if(!LOG_UNIFIED) pushLog(`${c.name}: ${def.desc(amt, c)}`);
    };
  });
  orderedEffectIds(c, PLAYER_EFFECT_ORDER).forEach(id=>{ if(steps[id]) steps[id](); });
}

// One repetition of a card's effect: its numeric effects plus its card-operation.
function applyCardEffectsOnce(r, c, done){
  applyEffectValues(r, c);
  if(c.cardOp && c.cardOp.enabled){
    resolveCardOp(r, c.cardOp, done);
  } else {
    done();
  }
}

// Repeats a card's effect "hits" times. Used when a registered trigger fires later:
// the repeats belong to that one trigger activation, so they don't count as extra card uses.
function applyCardEffects(r, c, done){
  const replays = Math.max(1, (c.hits||1) + scaleBonus(c,'hits'));
  let rep = 0;
  (function step(){
    if(rep>=replays || r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
    rep++;
    applyCardEffectsOnce(r, c, ()=>{
      if(r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
      step();
    });
  })();
}

// Counts one "use" of a card (play count, tags used this turn) and lets tag-based
// reactions (relics, then previously registered card triggers) fire for it.
function registerCardUse(r, c, done){
  r.cardsPlayedThisTurn = (r.cardsPlayedThisTurn||0) + 1;
  if(c.tags && c.tags.length){ r.tagsPlayedThisTurn = (r.tagsPlayedThisTurn||[]).concat(c.tags); }
  fireRelicTiming(r, 'onTagCardUsed', c);
  fireMatchingTriggers(r, c, done);
}

// Shared "this card is now being used" logic (energy is paid by the caller, once).
// A card that resolves immediately counts as one separate use per hit: each hit
// re-fires tag triggers and adds to the play/tag counts, then resolves one repetition of
// its effect. A card set to "trigger" timing only registers once; its hits multiply
// the effect each time the trigger later fires.
function resolveCardPlayCore(r, c, done){
  if(c.timing === 'trigger'){
    registerCardUse(r, c, ()=>{
      r.activeTriggers.push({
        triggerTag: c.triggerTag || '',
        triggerOn: c.triggerOn==='damaged' ? 'damaged' : 'cardUsed',
        triggerBlocked: !!c.triggerBlocked,
        duration: c.duration || 'combat',
        cardData: c,
      });
      pushLog(`${c.name}: 効果を仕込んだ（今後の該当カード使用時に発動）。`);
      done();
    });
    return;
  }
  const uses = Math.max(1, (c.hits||1) + scaleBonus(c,'hits'));
  let use = 0;
  (function nextUse(){
    if(use>=uses || r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
    use++;
    registerCardUse(r, c, ()=>{
      if(r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
      applyCardEffectsOnce(r, c, nextUse);
    });
  })();
}

// 敵の攻撃でダメージを受けたとき発動するトリガー。攻撃1回（多段攻撃なら1ヒット）ごとに発動する。
// ブロックで全部防いだ攻撃は、カードの「ブロックで防いだ場合も発動する」がONのときだけ発動する。
function fireDamageTriggers(r, done){
  const events = r.damageEvents || [];
  r.damageEvents = [];
  if(!events.length || !r.activeTriggers || !r.activeTriggers.some(t=>t.triggerOn==='damaged')){ done(); return; }
  let ei = 0;
  (function nextEvent(){
    if(ei>=events.length){ done(); return; }
    const ev = events[ei++];
    const snapshot = r.activeTriggers.filter(t=>t.triggerOn==='damaged');
    let ti = 0;
    (function nextTrig(){
      if(ti>=snapshot.length){ nextEvent(); return; }
      const t = snapshot[ti++];
      const ok = ev.hpLoss>0 || (t.triggerBlocked && ev.total>0);
      if(ok){ pushLog(`${t.cardData.name}: ダメージを受けて発動。`); applyCardEffects(r, t.cardData, nextTrig); }
      else nextTrig();
    })();
  })();
}

function fireMatchingTriggers(r, playedCard, done){
  if(!r.activeTriggers || r.activeTriggers.length===0){ done(); return; }
  // Snapshot first: resolving a trigger can itself register new triggers (e.g. via a
  // chained "play" cardOp), and those shouldn't fire again within this same pass.
  const snapshot = r.activeTriggers.slice();
  let idx = 0;
  (function next(){
    if(idx>=snapshot.length){ done(); return; }
    const trig = snapshot[idx++];
    if(trig.triggerOn==='damaged'){ next(); return; }
    const tagOk = !trig.triggerTag || (playedCard.tags && playedCard.tags.includes(trig.triggerTag));
    if(tagOk) applyCardEffects(r, trig.cardData, next);
    else next();
  })();
}


/* ============================= EDITOR TOOLS (reorder / duplicate) ============================= */

let reorderMode = false;
// ids = 新しい並び順（同じグループ内のID）。リスト全体の中で、そのグループが占めていた位置にだけ反映する。
function reorderSubset(list, ids){
  const set = new Set(ids);
  const slots = [];
  list.forEach((x,i)=>{ if(set.has(x.id)) slots.push(i); });
  if(slots.length!==ids.length) return list;
  const byId = new Map(list.map(x=>[x.id,x]));
  const out = list.slice();
  slots.forEach((pos,k)=>{ out[pos] = byId.get(ids[k]); });
  return out;
}
function bindReorderGrid(grid, onDrop){
  const wraps = ()=> Array.from(grid.children).filter(n=>n.classList.contains('editor-card-wrap'));
  wraps().forEach(w=>{
    w.addEventListener('pointerdown', ev=>{
      if(ev.pointerType==='mouse' && ev.button!==0) return;
      ev.preventDefault();
      try{ w.setPointerCapture(ev.pointerId); }catch(e){}
      w.classList.add('dragging');
      let moved = false;
      const onMove = e=>{
        moved = true;
        if(e.clientY<70) window.scrollBy(0,-16);
        else if(e.clientY>window.innerHeight-70) window.scrollBy(0,16);
        const under = document.elementsFromPoint(e.clientX, e.clientY)
          .find(n=> n!==w && n.classList && n.classList.contains('editor-card-wrap') && n.parentNode===grid);
        if(!under) return;
        // ドラッグ中の要素 w 自体はDOMから外さない（外すとポインタ追跡が切れて、1回で止まってしまう）。
        // 代わりに、間にある要素を w の反対側へ動かして、w が under を越えた並びにする。
        const kids = wraps();
        const a = kids.indexOf(w), b = kids.indexOf(under);
        if(a<b){
          kids.slice(a+1, b+1).forEach(n=> grid.insertBefore(n, w));
        } else {
          for(let i=a-1;i>=b;i--) grid.insertBefore(kids[i], w.nextSibling);
        }
      };
      const end = ()=>{
        w.removeEventListener('pointermove', onMove);
        w.removeEventListener('pointerup', end);
        w.removeEventListener('pointercancel', end);
        w.classList.remove('dragging');
        try{ w.releasePointerCapture(ev.pointerId); }catch(e){}
        if(moved) onDrop(wraps().map(x=>x.dataset.id));
      };
      w.addEventListener('pointermove', onMove);
      w.addEventListener('pointerup', end);
      w.addEventListener('pointercancel', end);
    });
  });
}
// getList/setList: そのデータの配列を読み書きする（setListは保存まで行う）
// rerender: 画面の描き直し／dup(copy): 複製データを整える（新しいIDなどを付けて返す）
function bindEditorTools(o){
  const screen = qs('.screen');
  if(screen){
    screen.classList.toggle('reorder-on', reorderMode);
    if(!qs('.reorder-hint', screen)){
      const hint = el('<p class="reorder-hint">並べ替えモード：カードをドラッグして順番を入れ替えます（同じ区分の中で移動できます）。</p>');
      const tb = qs('.topbar', screen);
      if(tb) tb.insertAdjacentElement('afterend', hint);
    }
  }
  const btn = qs('#btn-reorder');
  if(btn){
    btn.textContent = reorderMode ? '並べ替えを終了' : '並べ替え';
    btn.classList.toggle('active', reorderMode);
    btn.onclick = ()=>{ reorderMode = !reorderMode; o.rerender(); };
  }
  qsa('.dup-btn').forEach(b=>{
    b.onclick = ()=>{
      const id = b.closest('.editor-card-wrap').dataset.id;
      const list = o.getList();
      const i = list.findIndex(x=>x.id===id);
      if(i<0) return;
      const copy = o.dup(JSON.parse(JSON.stringify(list[i])));
      const out = list.slice();
      out.splice(i+1, 0, copy);
      o.setList(out);
      o.rerender();
    };
  });
  if(reorderMode){
    qsa('.editor-grid').forEach(grid=> bindReorderGrid(grid, ids=>{
      o.setList(reorderSubset(o.getList(), ids));
      o.rerender();
    }));
  }
}

/* ============================= CARD EDITOR SCREEN ============================= */

function renderEditor(){
  const groups = [['basic','ベーシック'],['common','コモン'],['uncommon','アンコモン'],['rare','レア'],['generated','生成専用'],['enemy','敵専用']];
  if(!groups.some(g=>g[0]===S.cardEditorTab)) S.cardEditorTab = 'common';
  let html = `
  <div class="screen">
    <div class="topbar">
      <div><p class="eyebrow">CARD EDITOR</p><h2>カードを編集する</h2></div>
      <div class="topbar-btns"><button class="ghost" id="btn-reorder">並べ替え</button><button class="ghost" id="btn-back">← ホームへ</button></div>
    </div>`;
  html += `<div class="tab-row">${groups.map(([rar,label])=>`<button class="tab-btn ${S.cardEditorTab===rar?'active':''}" data-tab="${rar}">${label}（${S.cards.filter(c=>c.rarity===rar).length}）</button>`).join('')}</div>`;
  groups.filter(g=>g[0]===S.cardEditorTab).forEach(([rar,label])=>{
    const cards = S.cards.filter(c=>c.rarity===rar);
    html += `<div class="section-label">${label}（${cards.length}種）</div><div class="editor-grid">`;
    cards.forEach(c=>{
      html += `<div class="editor-card-wrap" data-id="${c.id}">
        ${renderCardHTML(c,{mini:true})}
        <div class="edit-actions">
          <button class="edit-btn">編集</button><button class="dup-btn">複製</button>
          <button class="del-btn">削除</button>
        </div>
      </div>`;
    });
    if(rar!=='basic'){
      html += `<div class="add-card-tile" data-rarity="${rar}">＋</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  app().innerHTML = html;
  bindEditorTools({getList:()=>S.cards, setList:v=>{ S.cards=v; saveCards(v); }, rerender:renderEditor, dup:c=>{ c.id=newId(); c.name+='（コピー）'; c.startingCount=0; return c; }});

  qs('#btn-back').onclick = ()=>{ S.screen='home'; renderHome(); };
  qsa('.tab-btn').forEach(b=> b.onclick = ()=>{ S.cardEditorTab = b.dataset.tab; renderEditor(); });
  qsa('.edit-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.closest('.editor-card-wrap').dataset.id;
      openCardModal(cardById(id), false);

  qsa('.del-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.closest('.editor-card-wrap').dataset.id;
      if(confirm('このカードを削除しますか？')){
        S.cards = S.cards.filter(c=>c.id!==id);
        saveCards(S.cards);
        renderEditor();
      }
    };
  });
  qsa('.add-card-tile').forEach(tile=>{
    tile.onclick = ()=>{
      openCardModal({
        id:newId(), name:'新しいカード', type:'attack', cost:1, rarity: tile.dataset.rarity, startingCount:0,
        damage:0, block:0, draw:0, energy:0, strength:0, permStrength:0, weak:0, vulnerable:0, poison:0, heal:0, metallicize:0, permMetallicize:0, loseHp:0, exhaust:false,
        tags:[], hits:1, scales:{}
      }, true);
    };
  });
}

  function forcedRowHTML(rule, i){
    const subj = FORCED_SUBJECTS.find(s=>s.key===rule.subject) || FORCED_SUBJECTS[0];
    const cmpLabels = FORCED_CMP_LABELS[subj.key==='turn' ? 'turn' : 'val'];

      else if(t.dataset.num){ const v = parseInt(t.value,10); rule[f] = isNaN(v) ? 0 : v; }
      else rule[f] = t.value;
      return true;

    box.addEventListener('input', e=>{ sync(e.target); });

      if(e.target.dataset.f==='subject'){

    en.forcedMoves.push({subject:'selfHpPct', cmp:'lte', value:50, tag:'', cardId:(movePool[0]||{}).id||'strike', once:true, conflict:'priority'});

  };

  function chainRowHTML(ch, i){
    const opts = id=> movePool.map(c=>`<option value="${c.id}" ${c.id===id?'selected':''}>${c.name}</option>`).join('');
    return `<div class="ev-eff" data-idx="${i}">
      <div class="ev-eff-head"><span>連続行動 ${i+1}</span><button type="button" class="ghost em-chain-del">削除</button></div>
      <div class="ev-eff-grid">
        <div><label>この行動が選ばれたら</label><select data-f="fromId">${opts(ch.fromId)}</select></div>
        <div><label>次は必ずこの行動</label><select data-f="toId">${opts(ch.toId)}</select></div>
      </div>
    </div>`;
  }
  function renderChainList(){
    const box = qs('#em-chain-list',overlay);
    box.innerHTML = en.chains.length ? en.chains.map(chainRowHTML).join('') : `<p class="hint">連続行動はありません。</p>`;
  }
  renderChainList();
  (function(){
    const box = qs('#em-chain-list',overlay);
    box.addEventListener('change', e=>{
      const row = e.target.closest && e.target.closest('[data-idx]');
      const f = e.target.dataset && e.target.dataset.f;
      const ch = row && en.chains[parseInt(row.dataset.idx,10)];
      if(ch && f) ch[f] = e.target.value;
    });
    box.addEventListener('click', e=>{
      const b = e.target.closest('.em-chain-del');
      if(!b) return;
      en.chains.splice(parseInt(b.closest('[data-idx]').dataset.idx,10),1);
      renderChainList();
    });
  })();
  qs('#em-chain-add',overlay).onclick = ()=>{
    const first = (movePool[0]||{}).id||'strike';
    const used = new Set(en.chains.map(c=>c.fromId));
    const from = (movePool.find(c=>!used.has(c.id))||{}).id || first;
    en.chains.push({fromId:from, toId:first});
    renderChainList();
  };

  qs('#em-cancel',overlay).onclick = ()=> overlay.remove();
  qs('#em-save',overlay).onclick = ()=>{
    const updated = {
      startCards: en.startCards.slice(),
      forcedMoves: cleanForcedMoves(en.forcedMoves),
      chains: cleanChains(en.chains),
      dropRelicId: qs('#em-drop-relic',overlay).value,
      dropCardIds: en.dropCardIds.slice(),
      id: en.id,
      name: qs('#em-name',overlay).value.trim() || '無名の敵',
      emoji: (qs('#em-emoji',overlay).value||'').trim(),
      image: en.image||'',
      category: qs('#em-category',overlay).value,
      baseHp: clampInt(qs('#em-hp',overlay).value,1,999,30),
      weight: clampInt(qs('#em-weight',overlay).value,1,20,1),
      deck: en.deck.slice(),
      startEffect: {},
    };
    enemyStartFieldDefs().forEach(def=>{
      updated.startEffect[def.key] = clampInt(qs(`#em-eff-${def.key}`,overlay).value,0,def.max||99,0);
      if(def._statusId){
        const sel = qs(`#em-efft-${def._statusId}`,overlay);
        if(sel && ['self','opponent'].includes(sel.value)) updated.startEffect['csT_'+def._statusId] = sel.value;
      }
    });
    if(updated.deck.length===0) updated.deck = [{cardId:'strike', weight:1}];
    if(isNew){ S.enemies.push(updated); }
    else{ S.enemies = S.enemies.map(x=> x.id===updated.id? updated : x); }
    saveEnemies(S.enemies);
    overlay.remove();
    renderEnemyEditor();
  };
}

function customStatusUsage(statusId){
  const key = 'cs_'+statusId;
  const cardIds = S.cards.filter(c=>
    (c[key]) || (c['csX_'+statusId]) || (c.scales && c.scales[key]) || (c.upgrades && (c.upgrades[key] || (c.upgrades.scalePP && c.upgrades.scalePP[key])))
    || (c.cardOp && c.cardOp.enabled && c.cardOp.type==='grantBuff' && c.cardOp.buffField===key)
    || Object.values(c.scales||{}).some(sc=> sc && (sc.source==='csSelf:'+statusId || sc.source==='csEnemy:'+statusId))
  ).map(c=>c.id);
  const relicIds = S.relics.filter(rel=> rel.effect && rel.effect[key]).map(rel=>rel.id);
  return {cardIds, relicIds};
}
function stripCustomStatusRefs(statusId){
  const key = 'cs_'+statusId;
  S.cards.forEach(c=>{
    delete c[key]; delete c['csT_'+statusId]; delete c['csX_'+statusId];
    if(c.scales){
      delete c.scales[key];
      Object.keys(c.scales).forEach(f=>{ const sc = c.scales[f]; if(sc && (sc.source==='csSelf:'+statusId || sc.source==='csEnemy:'+statusId)) delete c.scales[f]; });
    }
    if(c.upgrades){ delete c.upgrades[key]; if(c.upgrades.scalePP) delete c.upgrades.scalePP[key]; }
    if(c.cardOp && c.cardOp.buffField===key){ c.cardOp.enabled = false; }
  });
  saveCards(S.cards);
  S.relics.forEach(rel=>{ if(rel.effect) delete rel.effect[key]; });
  saveRelics(S.relics);
}

// A status's card-operation is restricted to configurations that resolve at the start of
// the player's turn (no "play for free" types, which could chain into further plays).
const STATUS_CARDOP_TYPES = CARDOP_TYPES.filter(t=>t.key!=='play' && t.key!=='generatePlay');

function newStatusEffect(kind){
  const e = {kind, magnitudeMode:'fixed', magnitudeValue:1};
  if(kind==='cardOp') e.op = defaultStatusOp();
  if(kind==='revive'){ e.reviveUnit = 'percent'; e.magnitudeValue = 30; }
  return e;
}
function statusEffectLabel(kind){
  if(kind==='cardOp') return 'カード操作（プレイヤーのデッキを操作する）';
  return (CUSTOM_STATUS_KINDS.find(k=>k.key===kind)||{}).label || kind;
}
function statusEffectShort(eff){
  if(eff.kind==='cardOp'){
    const t = (STATUS_CARDOP_TYPES.find(x=>x.key===(eff.op||{}).type)||{}).label || '';
    return `カード操作（${t}）`;
  }
  return statusEffectLabel(eff.kind).replace(/（.*$/,'');
}

      <div class="field"><label>絵文字</label><input type="text" id="sm-emoji" value="${escapeHtml(st.emoji||'')}" maxlength="4"></div>
      <div class="field"><label>タグ（カンマ区切りで複数入力可）</label><input type="text" id="sm-tags" value="${escapeHtml((st.tags||[]).join(', '))}" placeholder="例: 強化">

      <div class="field"><label>② これらのタグの状態が付与されている間は、自分を付与しない（カンマ区切り）</label><input type="text" id="sm-excl-yield" value="${escapeHtml((st.exclYield||[]).join(', '))}" placeholder="例: 強化">
        <p class="hint">組み込みの強化・器用・弱体・脆弱・毒・再生・麻痺・自動ブロック・棘も、同名のタグとして指定できます（永続の強化・器用などは①の取り除きの対象外）。自分自身のタグは数えないので、全部の状態に同じタグを付けて、自分にも同じタグを指定しても、同じ状態は重ね掛けできます。判定は付与のときだけで、ターンごとの増減では働きません。②は①より先に判定します。</p></div>

      <div class="field"><label>④ 自分がいる間、これらのタグの状態の付与を無効にする（カンマ区切り）</label><input type="text" id="sm-excl-guard" value="${escapeHtml((st.exclGuard||[]).join(', '))}" placeholder="例: 脆弱">

      <div class="field"><label>標準の付与先（カードでは、カードごとに「自分に／相手に」を変更できます。レリック・イベント・敵の戦闘開始時効果は、この設定に従います）</label>
        <select id="sm-target">
          <option value="self" ${st.target==='self'?'selected':''}>自分</option>
          <option value="opponent" ${st.target==='opponent'?'selected':''}>相手</option>
        </select>
        <p class="hint">敵の技が付与する場合は立場が逆になります。「相手」＝プレイヤーが受け取る、「自分」＝敵自身が受け取る。敵からプレイヤーに付与したい状態は「相手」にしてください。</p>
      </div>
      <div class="field"><label>ターンごとの増減（自分のターン開始時。マイナスで減少、プラスで増加、0で変化なし）</label><input type="number" id="sm-perturndelta" value="${st.perTurnDelta||0}" min="-99" max="99"></div>
      <p class="hint">対象が「自分」の毒・脆弱のような減衰は、ここを-1にすると再現できます。強化・自動ブロックのように戦闘中ずっと残したいなら0のままにします。</p>
      <div class="checkbox-field"><input type="checkbox" id="sm-persistent" ${st.persistent?'checked':''}><label for="sm-persistent">戦闘が終わっても残す（永続。チェックなしなら、戦闘ごとに消えます）</label></div>
      <div class="section-label">効果（複数追加できます。すべて同時に働きます）</div>
      <div id="sm-effects"></div>
      <div class="ev-add"><select id="sm-addkind">${addOptions.map(o=>`<option value="${o.key}">${escapeHtml(o.label)}</option>`).join('')}</select><button type="button" id="sm-addbtn">＋ 効果を追加</button></div>
      <div class="ev-add" style="margin-top:6px;"><button type="button" id="sm-addop" style="flex:1;">＋ カード操作を追加（手札を捨てさせる・カードを生成する など）</button></div>
      <p class="hint">カード操作は、この状態を持っている側のデッキへ、ターン開始時（手札を引いた後）に行われます。敵が持つ場合は視点が反転し、敵自身のデッキへ作用します（「敵のデッキに加える」だけはプレイヤーの山札）。いくつでも追加できます。</p>
      <div class="modal-actions">
        <button class="ghost" id="sm-cancel">キャンセル</button>
        <button class="primary" id="sm-save">保存する</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const box = qs('#sm-effects', overlay);
  function renderEffects(){
    box.innerHTML = st.effects.length
      ? st.effects.map(statusEffectFormHTML).join('')
      : `<p class="ev-hint">効果がありません（下のメニューから追加してください）。</p>`;
  }
  function sync(t){
    const f = t.dataset && t.dataset.f;
    if(!f) return;
    const eff = st.effects[parseInt(t.dataset.i,10)];
    if(!eff) return;
    const obj = t.dataset.op ? eff.op : eff;
    if(t.dataset.num){ const v = t.dataset.num==='float' ? parseFloat(t.value) : parseInt(t.value,10); obj[f] = isNaN(v) ? 0 : v; }
    else obj[f] = t.value;
  }
  box.addEventListener('input', e=>{
    if(e.target.dataset && e.target.dataset.gf){ const g = (st.effects[+e.target.dataset.i]||{}).reviveGrants||[]; if(g[+e.target.dataset.j]) g[+e.target.dataset.j].stacks = Math.max(1, Math.min(99, parseInt(e.target.value,10)||1)); return; }
    sync(e.target);
  });
  box.addEventListener('change', e=>{
    sync(e.target);
    if(e.target.dataset && e.target.dataset.rerender) renderEffects();
  });
  box.addEventListener('click', e=>{
    const ag = e.target.closest('[data-addgrant]');
    if(ag){
      const i = +ag.dataset.addgrant, eff = st.effects[i];
      const sel = box.querySelector(`select[data-grantpick="${i}"]`);
      if(eff && sel && sel.value){ (eff.reviveGrants = eff.reviveGrants||[]).push({statusId:sel.value, stacks:1}); renderEffects(); }
      return;
    }
    const dg = e.target.closest('[data-delgrant]');
    if(dg){
      const [i,j] = dg.dataset.delgrant.split(':').map(Number);
      const eff = st.effects[i]; if(eff && eff.reviveGrants){ eff.reviveGrants.splice(j,1); renderEffects(); }
      return;
    }
    const b = e.target.closest('[data-del]');
    if(!b) return;
    st.effects.splice(parseInt(b.dataset.del,10),1);
    renderEffects();
  });
  qs('#sm-addbtn',overlay).onclick = ()=>{
    st.effects.push(newStatusEffect(qs('#sm-addkind',overlay).value));
    renderEffects();
  };
  qs('#sm-addop',overlay).onclick = ()=>{
    st.effects.push(newStatusEffect('cardOp'));
    renderEffects();
  };
  renderEffects();
  qs('#sm-cancel',overlay).onclick = ()=> overlay.remove();
  qs('#sm-save',overlay).onclick = ()=>{
    const updated = normalizeCustomStatus({
      id: st.id,
      tags: parseTags(qs('#sm-tags',overlay).value),
      name: qs('#sm-name',overlay).value.trim() || '無名の状態',
      emoji: (qs('#sm-emoji',overlay).value||'').trim(),
      target: qs('#sm-target',overlay).value,
      perTurnDelta: clampInt(qs('#sm-perturndelta',overlay).value,-99,99,0),
      persistent: qs('#sm-persistent',overlay).checked,
      exclOverwrite: parseTags(qs('#sm-excl-overwrite',overlay).value),
      exclYield: parseTags(qs('#sm-excl-yield',overlay).value),
      exclReplaced: parseTags(qs('#sm-excl-replaced',overlay).value),
      exclGuard: parseTags(qs('#sm-excl-guard',overlay).value),
      effects: st.effects,
    });
    if(isNew){ S.customStatuses.push(updated); }
    else{ S.customStatuses = S.customStatuses.map(x=> x.id===updated.id? updated : x); }
    saveCustomStatuses(S.customStatuses);
    overlay.remove();
    renderStatusEditor();
  };
}

function relicEffectFieldsHTML(timing, effect){
  return relicFieldDefsFor(timing).map(def=>`
    <div class="field">
      <label>${def.label}</label>
      <input type="number" id="rm-eff-${def.key}" value="${effect[def.key]||0}" min="0" max="${def.max||99}">
    </div>`).join('');
}

      </div>

    qs('#rm-effect-label',overlay).textContent = t==='onPickup' ? '効果（入手時に一度だけ適用）' : '効果（このタイミングになるたび発動）';
    qs('#rm-effect-fields',overlay).innerHTML = relicEffectFieldsHTML(t, rel.effect);
    const hint = qs('#rm-hint',overlay);
    hint.textContent = relicTimingHint(t);
    hint.style.display = relicTimingHint(t) ? '' : 'none';
  };

    const t = qs('#rm-timing',overlay).value;
    const updated = {

      name: qs('#rm-name',overlay).value.trim() || '無名のレリック',
      rarity: qs('#rm-rarity',overlay).value,

      favorTag: cleanTag(qs('#rm-favortag',overlay).value),

    else{ S.relics = S.relics.map(x=> x.id===updated.id? updated : x); }
    saveRelics(S.relics);
    overlay.remove();
    renderRelicEditor();
  };
}

  document.body.appendChild(overlay);

      pickers.forEach(p=>{
        const sel = qs('.fx-pick',p);
        const hidden = rowsOf(p.dataset.group).filter(r=>r.style.display==='none');
        sel.innerHTML = hidden.map(r=>`<option value="${escapeHtml(r.dataset.fx)}">${escapeHtml(r.dataset.label)}</option>`).join('');

  };
  // ----- 効果の順番（並べ替え） -----
  let orderState = Array.isArray(c.effectOrder) ? c.effectOrder.slice() : [];
  const legacyFirst = !!(c.statusOp && c.statusOp.first) && orderState.length===0;
  const presentEffects = ()=>{
    const list = [];
    qsa('.fx-row[data-group="num"], .fx-row[data-group="cs"]', overlay).forEach(row=>{
      if(row.style.display==='none' || row.dataset.fx==='hits') return;
      list.push({id:row.dataset.fx, label:(row.dataset.label||row.dataset.fx).split('（')[0]});
    });
    if(qs('#m-so-enabled',overlay).checked) list.push({id:'statusOp', label:'状態の操作'});
    return list;
  };
  const currentOrder = ()=>{
    const present = presentEffects();
    const ids = orderedEffectIds({effectOrder:orderState, statusOp:{first:legacyFirst && orderState.length===0}}, PLAYER_EFFECT_ORDER);
    return ids.filter(id=> present.some(x=>x.id===id)).map(id=> present.find(x=>x.id===id));
  };
  const orderListEl = qs('#eo-list', overlay);
  const orderFromDom = ()=> qsa('.eo-item', orderListEl).map(el=>el.dataset.id);
  const renderOrder = ()=>{
    const items = currentOrder();
    if(!items.length){ orderListEl.innerHTML = '<p class="hint">効果が設定されていません。</p>'; return; }
    orderListEl.innerHTML = items.map(x=>`<div class="eo-item" data-id="${escapeHtml(x.id)}"><span class="eo-handle" title="ドラッグで入れ替え">☰</span><span class="eo-label">${escapeHtml(x.label)}</span><button type="button" class="ghost eo-btn eo-up" title="上へ">▲</button><button type="button" class="ghost eo-btn eo-down" title="下へ">▼</button></div>`).join('');
  };
  const commitOrder = ()=>{ orderState = orderFromDom(); renderOrder(); };
  orderListEl.addEventListener('click', e=>{
    const item = e.target.closest('.eo-item'); if(!item) return;
    if(e.target.closest('.eo-up') && item.previousElementSibling) item.parentNode.insertBefore(item, item.previousElementSibling);
    else if(e.target.closest('.eo-down') && item.nextElementSibling) item.parentNode.insertBefore(item.nextElementSibling, item);
    else return;
    commitOrder();
  });
  (()=>{   // ドラッグでの入れ替え（マウス・タッチ共通）
    let drag = null;
    orderListEl.addEventListener('pointerdown', e=>{
      const h = e.target.closest('.eo-handle'); if(!h) return;
      drag = h.closest('.eo-item'); drag.classList.add('dragging');
      try{ h.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    orderListEl.addEventListener('pointermove', e=>{
      if(!drag) return;
      const items = qsa('.eo-item', orderListEl);
      const di = items.indexOf(drag);
      items.forEach((it, i)=>{
        if(it===drag) return;
        const rc = it.getBoundingClientRect(), mid = rc.top + rc.height/2;
        if(i<di && e.clientY<mid) orderListEl.insertBefore(drag, it);
        else if(i>di && e.clientY>mid) orderListEl.insertBefore(drag, it.nextSibling);
      });
    });
    const end = ()=>{ if(!drag) return; drag.classList.remove('dragging'); drag = null; commitOrder(); };

    const updated = {
